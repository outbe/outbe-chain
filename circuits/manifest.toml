# L2 tribute selections. `selector` is the offerTribute version string, not a
# package release. Paths are relative to l2/<chain_id>/.
#
# `vk_hash` is the pin for keccak256(circuit.vk). build.rs compiles the package
# with the pinned nargo/bb and then applies one of three modes:
#   1. vk_hash = "<64 lowercase hex>" — fixed. Fail the build if the derived key differs.
#   2. vk_hash = "unstable" — no stable key. Accept the derived key; used for tests.
#   3. vk_hash = "" — empty. Write the derived key into this manifest during the build.
proof_system = "bb-keccak-v1"

[[l2_chain]]
chain_id = 57005

[[l2_chain.versions]]
selector = "1.1.0"
circuits = [
  { path = "tribute", vk_hash = "fdf9a32867af91ba7f0a382a58b6c46e9a8843546febd67852c6a1a74f596f92" },
]

[[l2_chain]]
chain_id = 9900501

[[l2_chain.versions]]
selector = "1.0.0"
circuits = [
  { path = "tribute", vk_hash = "90c6f573aac337f2e885018d78dbb4f297572f87dd93e10fb597f6abd970eabd" },
]

# L1 frozen releases. Artifacts live at
# `resources/circuits/<module>/<version>/{bytecode.b64, circuit.vk, abi.json}`
# and are immutable once committed. build.rs generates the Rust types for the
# latest active version of each module without invoking nargo or bb.

[[circuit]]
module = "paynote"
label = "outbe.paynote"
versions = [
  { version = "1.4.0", status = "active" },
]

[[circuit]]
module = "paynote_merge"
label = "outbe.paynote.merge"
versions = [
  { version = "1.2.0", status = "active" },
]
