[tools]
# -- Core -------------------------------------------------------------- #
rust = "1.96"                      # build outbe-chain + all crates
foundry = "latest"                 # forge, cast, anvil (Solidity + Ethereum CLI)

# -- System deps ----------------------------------- #
# These must come from the system package manager:
#   - gcc / clang   (C/C++ toolchain for native crates)
#   - openssl       (linked by openssl-sys; pkg-config locates it)
# macOS: `brew install openssl pkg-config` (clang ships with Xcode CLT)
# Debian/Ubuntu: `sudo apt install build-essential clang libssl-dev pkg-config libc++-dev libc++abi-dev`

# -- Cargo tools ------------------------------------------------------- #
# Core tools needed by build/test/audit tasks. The heavier audit toolchain
# (machete, udeps, bloat, llvm-lines, llvm-cov) is installed on
# demand by `mise run audit-tools-install` to mirror the old Makefile.
"cargo:cargo-binstall"  = "latest"
"cargo:cargo-nextest"   = "latest"
"cargo:cargo-deny"      = "latest"
"cargo:cargo-auditable" = "latest"
"cargo:cargo-audit"     = "latest"

# -- Release / versioning ---------------------------------------------- #
cocogitto = "7"                    # `cog` - conventional-commit check + auto-version bump
duckdb = "latest"

# outbe-zk's build.rs compiles L2 circuits. Versions must match the pins in
# crates/zk/outbe-zk/build.rs. Install with `mise install`; CI caches these tools
# and sets global versions so shims also work outside the checkout.
[tools.nargo]
version = "1.0.0-beta.22"
matching_regex = "^nargo-"
rename_exe = "nargo"

[tools.bb]
version = "5.0.0-nightly.20260522"
matching_regex = "^barretenberg-(amd64|arm64)-(darwin|linux)\\.tar\\.gz$"
rename_exe = "bb"

[tool_alias]
nargo = "github:noir-lang/noir"
bb = "github:AztecProtocol/barretenberg"

[env]
# radicle-node (outbe-heartwood) bakes this in at compile time via `env!`;
# without it every workspace-wide build fails. Release builds pass their own
# value through the reproducible-build container args.
SOURCE_DATE_EPOCH  = "0"

# --- Build ------------------------------------------------------------ #

[tasks.build]
description = "Build the workspace (debug, cargo auditable)"
run = [
  "cargo auditable build",
  "cargo auditable build -p outbe-tee-enclave --features mock --bin outbe-tee-enclave-mock",
]

[tasks.build-release]
description = "Build the workspace (release, cargo auditable)"
run = "cargo auditable build --release --features outbe-chain/production-enclave"

# --- Format / Lint ---------------------------------------------------- #

[tasks.export-abi]
description = "Regenerate contracts/*/abi-export from Solidity (Rust reads the .sol; the MCP reads these JSONs)"
run = "mise run -C contracts export-abi"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without writing changes"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run clippy on all crates"
# No --all-features: it would turn on outbe-tee's `native-dcap`, whose build.rs
# links the pinned Intel SGX/DCAP toolchain (headers + .so) that only exists on
# the gramine-sgx build. Lint native-dcap only where that toolchain is present.
run = """
cargo clippy --workspace --all-targets -- -D warnings
if [ -f /usr/include/sgx_dcap_quoteverify.h ]; then
  cargo clippy -p outbe-tee --all-targets --features native-dcap -- -D warnings
fi
"""

[tasks.check]
description = "Type-check the workspace"
run = "cargo check --workspace"

# --- Test ------------------------------------------------------------- #

[tasks.test]
description = "Run the default test suite (cargo nextest run + cargo test --doc)"
run = [
  "cargo nextest run --workspace",
  "cargo test --doc --workspace",
]

[tasks.test-doc]
description = "Run workspace doctests only (nextest skips doctests)"
run = "cargo test --doc --workspace"

[tasks.test-consensus]
description = "Run consensus crate tests via nextest"
run = "cargo nextest run -p outbe-consensus"

[tasks.test-snapshot-integration]
description = "Run the native offline snapshot integration suite"
env = { RUST_TEST_THREADS = "2", RAYON_NUM_THREADS = "2" }
run = [
  "cargo test --locked -p outbe-chain --features snapshot-integration",
  "cargo test --locked -p outbe-engine --features snapshot-integration",
]

[tasks.nextest-install]
description = "Install cargo-nextest locally (one-shot helper)"
run = "cargo install --locked cargo-nextest"

# --- Audit (RustSec on built binaries) -------------------------------- #

[tasks.audit]
description = "Audit debug binaries for known vulnerabilities"
depends = ["build"]
run = "find target/debug -maxdepth 1 -type f -perm +111 -name 'outbe-*' -exec cargo audit --db ~/.cargo/rustsec-audit-db --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0391 --ignore RUSTSEC-2026-0398 --ignore RUSTSEC-2026-0403 --ignore RUSTSEC-2026-0418 bin {} \\;"

[tasks.audit-release]
description = "Audit release binaries for known vulnerabilities"
depends = ["build-release"]
run = "find target/release -maxdepth 1 -type f -perm +111 -name 'outbe-*' -exec cargo audit --db ~/.cargo/rustsec-audit-db --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0391 --ignore RUSTSEC-2026-0398 --ignore RUSTSEC-2026-0403 --ignore RUSTSEC-2026-0418 bin {} \\;"

# --- Audit toolchain (rust-module-audit skill entry points) ----------- #

[tasks.audit-tools-install]
description = "Install full cargo audit toolchain + nightly + miri/llvm components"
run = [
  "cargo install --locked cargo-nextest cargo-machete cargo-deny cargo-audit cargo-llvm-cov cargo-llvm-lines cargo-bloat cargo-mutants",
  "cargo install --locked cargo-udeps",
  "rustup toolchain install nightly",
  "rustup +nightly component add miri rust-src",
  "rustup component add llvm-tools-preview clippy rustfmt",
]

[tasks.audit-quick]
description = "Fast cycle: clippy -D warnings + cargo nextest run"
run = [
  "cargo clippy --all-targets -- -D warnings",
  "cargo nextest run --workspace",
]

[tasks.audit-consensus-deps]
description = "Ensure consensus has no transitive dependency on the EVM"
run = """
set -euo pipefail
tree="$(cargo tree -p outbe-consensus --prefix none)"
if grep -Eq '^outbe-evm ' <<<"${tree}"; then
  echo "error: outbe-evm appears in outbe-consensus dependency tree" >&2
  exit 1
fi
if ! grep -Eq '^commonware-consensus ' <<<"${tree}"; then
  echo "error: commonware-consensus is missing from outbe-consensus dependency tree" >&2
  exit 1
fi
echo "consensus dependency boundary: OK"
"""

[tasks.audit-full]
description = "Full cycle: machete + deny + rustsec + udeps"
depends = ["audit-machete", "audit-deny", "audit-rustsec", "audit-udeps"]

[tasks.audit-deny]
description = "cargo deny check (licenses, advisories, bans, sources)"
run = "cargo deny check"

[tasks.audit-rustsec]
description = "cargo audit (RustSec workspace dependency advisories)"
# Keep the adjudicated exceptions aligned with deny.toml and cve-scan.yml.
# cargo-deny uses a hashed database layout under ~/.cargo/advisory-db, so
# cargo-audit needs its own path.
run = "cargo audit --db ~/.cargo/rustsec-audit-db --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0391 --ignore RUSTSEC-2026-0398 --ignore RUSTSEC-2026-0403 --ignore RUSTSEC-2026-0418"

[tasks.audit-machete]
description = "cargo machete (unused workspace dependencies)"
run = "cargo machete"

[tasks.audit-udeps]
description = "cargo +nightly udeps --workspace --all-targets"
run = "cargo +nightly udeps --workspace --all-targets"

[tasks.audit-miri]
description = "cargo +nightly miri test --lib (UB / unsafe surface)"
run = "cargo +nightly miri test --lib"

[tasks.audit-bloat]
description = "cargo bloat --release --crates -n 30"
run = "cargo bloat --release --crates -n 30"

[tasks.audit-llvm-lines]
description = "cargo llvm-lines --release | head -50"
run = "cargo llvm-lines --release | head -50"

[tasks.audit-coverage]
description = "cargo llvm-cov nextest --html (HTML coverage report)"
run = "cargo llvm-cov nextest --workspace --html"

[tasks.audit-mutants]
description = "cargo mutants on consensus and economic crates (mutation kill-rate audit)"
run = "cargo mutants --test-tool nextest -p outbe-consensus -p outbe-fidelity-math -p outbe-lysis -p outbe-fidelity -p outbe-metadosis -p outbe-emission -p outbe-staking -p outbe-cycle"

[tasks.audit-bench]
description = "cargo bench (criterion baseline; configure benches per crate)"
run = "cargo bench --workspace"

# --- SGX / Benchmarks ------------------------------------------------- #

[tasks.release-sgx-prepare]
description = "Prepare an unsigned deterministic SGX bundle for an explicit production network"
run = 'cargo xtask release sgx prepare "$@"'

[tasks.release-sgx-compare]
description = "Compare two independently prepared unsigned SGX bundles"
run = 'cargo xtask release sgx compare "$@"'

[tasks.release-sgx-sign]
description = "Sign an unsigned SGX bundle with an explicitly supplied network release key"
run = 'cargo xtask release sgx sign "$@"'

[tasks.release-sgx-verify]
description = "Verify a pre-signed network SGX bundle and its SIGSTRUCT"
run = 'cargo xtask release sgx verify "$@"'

[tasks.release-sgx-archive]
description = "Archive a verified signed network SGX bundle deterministically"
run = 'cargo xtask release sgx archive "$@"'

[tasks.release-sgx-image]
description = "Build an immutable OCI image from a verified signed SGX bundle"
run = 'cargo xtask release sgx image "$@"'

[tasks.release-sgx-manifest]
description = "Assemble a network-bound ReleaseManifest from exact SGX release evidence"
run = 'cargo xtask release sgx manifest "$@"'

[tasks.release-sgx-hardware-e2e]
description = "Run Rust/Gherkin acceptance against an exact published production SGX image digest"
run = 'cargo run --locked -p xtask --features release-sgx-e2e --bin outbe-release-sgx-e2e -- "$@"'

# Tribute-offer enclave throughput. Two layers:
#  1) criterion micro-bench: pure in-enclave CPU cost per offer;
#  2) e2e test: same path INCLUDING the Noise/UDS transport round-trip.
[tasks.bench-tribute]
description = "Tribute-offer enclave throughput (criterion micro-bench + e2e transport)"
run = """
cargo bench -p outbe-tee-enclave --bench tribute_offer_throughput
cargo test -p outbe-tee-enclave --release --test transport \
  transport_throughput_offers_per_sec -- --ignored --nocapture
"""
