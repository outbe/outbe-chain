requirements:
  meta:
    OCOMP-POC-CLOSURE:
      text: >
        The independent verifier fails closed on incomplete, mixed, stale,
        skipped, retried-away or hash-corrupt evidence.
      tests: [OCM-EVD-001]
  adr:
    "ADR-S-OCM-001/I-01":
      text: OCOMP failure cannot stop consensus or mutate domain state.
      tests: [OCM-ISO-001, OCM-E2E-001, OCM-E2E-006]
    "ADR-S-OCM-001/I-02":
      text: Supervisor, exporter, worker, CAS and public submitters own no consensus authority.
      tests: [OCM-BND-001, OCM-E2E-001, OCM-ISO-001]
    "ADR-S-OCM-001/I-03":
      text: The Supervisor may invoke the Lysis finalizer but cannot supply precomputed final roots, totals or catalogs.
      tests: [OCM-BND-002, OCM-DET-001]
    "ADR-S-OCM-001/I-04":
      text: ROOT_REDUCE emits a bounded summary rather than a population-sized active collection.
      tests: [OCM-DET-001, OCM-BND-003, OCM-CAP-001]
    "ADR-S-OCM-001/I-05":
      text: Worker count never increases evidence weight.
      tests: [OCM-DET-001, OCM-VOT-001, OCM-E2E-001]
    "ADR-S-OCM-001/I-06":
      text: A worker-shard capacity limits one invocation and never limits the complete Tribute population of a job.
      tests: [OCM-SEM-002, OCM-CAP-001]
    "ADR-S-OCM-001/I-07":
      text: Job, manifest, plan and result objects use population-independent root/count/nominal commitments.
      tests: [OCM-BYT-001, OCM-BND-003, OCM-CAP-001]
    "ADR-S-OCM-001/I-08":
      text: Every authenticated Tribute belongs to exactly one canonical shard and unit with no loss or duplication.
      tests: [OCM-SEM-002, OCM-DET-001, OCM-E2E-001]
    "ADR-S-OCM-001/I-09":
      text: The kernel cannot enumerate or interpret Lysis business state.
      tests: [OCM-BND-002, OCM-REQ-001, OCM-TRC-001]
    "ADR-S-OCM-001/I-10":
      text: Local configuration or negotiation cannot choose consensus semantics.
      tests: [OCM-CTL-001, OCM-E2E-007]
    "ADR-S-OCM-001/I-11":
      text: Only the fork-pinned handler verifies and applies.
      tests: [OCM-BYT-002, OCM-BND-001, OCM-PUB-002]
    "ADR-S-OCM-001/I-12":
      text: Domain effects are unreachable through a generic write interface.
      tests: [OCM-BND-001, OCM-APL-002]
    "ADR-S-OCM-001/I-13":
      text: Lysis V1 bytes are never reinterpreted as a future common envelope.
      tests: [OCM-BYT-001, OCM-BND-001]
    "ADR-S-OCM-002/I-01":
      text: Event, Mongo, path and CAS name do not establish job authority.
      tests: [OCM-DIS-001, OCM-PIN-001, OCM-EXP-001, OCM-CAS-001]
    "ADR-S-OCM-002/I-02":
      text: Every consumed body matches identity and committed CE leaf.
      tests: [OCM-EXP-001, OCM-E2E-001]
    "ADR-S-OCM-002/I-03":
      text: Traversal reconstructs exact root, count and nominal.
      tests: [OCM-EXP-001, OCM-E2E-001]
    "ADR-S-OCM-002/I-04":
      text: Fidelity and Oracle values bind to job logical context.
      tests: [OCM-EXP-001, OCM-SEM-001, OCM-TIM-001]
    "ADR-S-OCM-002/I-05":
      text: Manifest names one JobId and one bundle.
      tests: [OCM-BYT-001, OCM-EXP-001]
    "ADR-S-OCM-002/I-06":
      text: Work-shard ranges are adjacent, non-overlapping and cover the exact manifest count.
      tests: [OCM-EXP-001, OCM-SEM-002, OCM-DET-001]
    "ADR-S-OCM-002/I-07":
      text: Workers consume only digest-verified manifest members.
      tests: [OCM-CAS-001, OCM-DET-001]
    "ADR-S-OCM-002/I-08":
      text: Fork-orphaned input is never signable.
      tests: [OCM-PIN-001]
    "ADR-S-OCM-002/I-09":
      text: Export ambiguity abstains rather than reading best-effort live state.
      tests: [OCM-EXP-001, OCM-CAS-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-01":
      text: Equal finalized inputs and bundle produce byte-identical units and result.
      tests: [OCM-SEM-002, OCM-DET-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-02":
      text: N authenticated Tribute produce the exact canonical shard/range set and crossing a shard boundary loses no input.
      tests: [OCM-SEM-002, OCM-DET-001, OCM-CAP-001]
    "ADR-S-OCM-003/I-03":
      text: Worker and scheduler count change neither result bytes nor evidence weight.
      tests: [OCM-DET-001, OCM-VOT-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-04":
      text: One validator index contributes at most one first vote to the tally.
      tests: [OCM-VOT-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-05":
      text: The OCOMP key is distinct from the consensus key and unavailable to compute processes.
      tests: [OCM-CTL-001, OCM-SIG-001, OCM-ISO-001]
    "ADR-S-OCM-003/I-06":
      text: Sign-once history is durable before signature release.
      tests: [OCM-SIG-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-07":
      text: A vote binds one exact result digest and one exact job attempt.
      tests: [OCM-BYT-001, OCM-VOT-001, OCM-PUB-001]
    "ADR-S-OCM-003/I-08":
      text: The quorum digest is set only by three matching eligible on-chain vote slots.
      tests: [OCM-VOT-001, OCM-PUB-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-09":
      text: The fourth slot remains writable until the exclusive response deadline after quorum apply.
      tests: [OCM-VOT-001, OCM-PUB-001]
    "ADR-S-OCM-003/I-10":
      text: A fourth vote or deadline close cannot change terminal result, apply receipt or exact-retry identity.
      tests: [OCM-VOT-001, OCM-PUB-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-11":
      text: A conflicting second vote records bounded equivocation evidence and never replaces or counts twice.
      tests: [OCM-VOT-001, OCM-PUB-001]
    "ADR-S-OCM-003/I-12":
      text: Absence and timeliness derive only from canonical inclusion heights.
      tests: [OCM-VOT-001, OCM-PUB-001, OCM-PUB-003]
    "ADR-S-OCM-003/I-13":
      text: Quorum evidence never replaces input completeness, data availability or independent semantics.
      tests: [OCM-SEM-001, OCM-EXP-001, OCM-E2E-001]
    "ADR-S-OCM-004/I-01":
      text: Request creation has no Lysis or owner effect.
      tests: [OCM-REQ-001, OCM-E2E-001]
    "ADR-S-OCM-004/I-02":
      text: Desis receives exactly auction_base before compute and is never topped up.
      tests: [OCM-REQ-001, OCM-E2E-001]
    "ADR-S-OCM-004/I-03":
      text: Intex has no reservation state and contributors are created only during quorum apply.
      tests: [OCM-REQ-001, OCM-BND-001, OCM-APL-002]
    "ADR-S-OCM-004/I-04":
      text: Promis has no reservation state and carry-over uses checked commutative addition.
      tests: [OCM-REQ-001, OCM-APL-002, OCM-TIM-001]
    "ADR-S-OCM-004/I-05":
      text: Only a finalized live exact attempt can be signed, submitted or applied.
      tests: [OCM-FIN-001, OCM-PIN-001, OCM-SIG-001, OCM-PUB-002]
    "ADR-S-OCM-004/I-06":
      text: Voting opens exactly four blocks after finality_recorded_height.
      tests: [OCM-FIN-001, OCM-PUB-003]
    "ADR-S-OCM-004/I-07":
      text: Only a timely eligible signed transaction can fill a result-vote slot.
      tests: [OCM-VOT-001, OCM-PUB-001]
    "ADR-S-OCM-004/I-08":
      text: The third matching first-vote slot atomically applies one canonical result and establishes COMPLETED or the defined CONFLICTED outcome; QUORUM_READY is not durable.
      tests: [OCM-VOT-001, OCM-PUB-001]
    "ADR-S-OCM-004/I-09":
      text: A timely quorum is applied by its q-forming vote transaction; there is no later activation step.
      tests: [OCM-VOT-001, OCM-PUB-002, OCM-PUB-003]
    "ADR-S-OCM-004/I-10":
      text: The fourth validator can vote until the exclusive deadline after quorum apply.
      tests: [OCM-VOT-001, OCM-PUB-001]
    "ADR-S-OCM-004/I-11":
      text: Fourth-vote and accountability writes never change immutable terminal result, apply receipt, active generation or exact-retry identity.
      tests: [OCM-VOT-001, OCM-PUB-001, OCM-E2E-001]
    "ADR-S-OCM-004/I-12":
      text: Missing-response and equivocation evidence are consensus-visible and PoC applies no monetary penalty.
      tests: [OCM-VOT-001, OCM-PUB-001]
    "ADR-S-OCM-004/I-13":
      text: Worker-shard completion is never a consensus terminal state.
      tests: [OCM-FSM-001, OCM-DET-001, OCM-E2E-001]
    "ADR-S-OCM-004/I-14":
      text: A late vote cannot race response-window close; a non-quorum job expires at the exclusive deadline and no separate activation exists.
      tests: [OCM-FSM-001, OCM-PUB-002, OCM-PUB-003]
    "ADR-S-OCM-004/I-15":
      text: Evidence verification does not execute Lysis.
      tests: [OCM-BND-002, OCM-TRC-001]
    "ADR-S-OCM-004/I-16":
      text: Only the private typed capability reaches effect methods.
      tests: [OCM-BND-001, OCM-APL-002]
    "ADR-S-OCM-004/I-17":
      text: All owner effects and terminal job state commit together or not at all.
      tests: [OCM-APL-002, OCM-E2E-006]
    "ADR-S-OCM-004/I-18":
      text: Exact terminal retry is idempotent and different terminal replay rejects.
