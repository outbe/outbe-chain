requirements:
  meta:
    OCOMP-POC-CLOSURE:
      text: >
        The independent verifier fails closed on incomplete, mixed, stale,
        skipped, retried-away or hash-corrupt evidence.
      tests: [OCM-EVD-001]
  adr:
    "ADR-S-OCM-001/I-01":
      text: OCOMP failure cannot stop consensus or mutate domain state.
      tests: [OCM-ISO-001, OCM-E2E-001, OCM-E2E-006]
    "ADR-S-OCM-001/I-02":
      text: Supervisor, exporter, worker, CAS and relay own no consensus authority.
      tests: [OCM-BND-001, OCM-E2E-001, OCM-ISO-001]
    "ADR-S-OCM-001/I-03":
      text: Worker count never increases evidence weight.
      tests: [OCM-DET-001, OCM-CRT-001, OCM-E2E-001]
    "ADR-S-OCM-001/I-04":
      text: Kernel cannot enumerate or interpret Lysis business state.
      tests: [OCM-BND-002, OCM-REQ-001, OCM-TRC-001]
    "ADR-S-OCM-001/I-05":
      text: Local configuration or negotiation cannot choose consensus semantics.
      tests: [OCM-CTL-001, OCM-E2E-007]
    "ADR-S-OCM-001/I-06":
      text: Only the fork-pinned handler verifies and applies.
      tests: [OCM-BYT-002, OCM-BND-001, OCM-PUB-002]
    "ADR-S-OCM-001/I-07":
      text: Domain effects are unreachable through a generic write interface.
      tests: [OCM-BND-001, OCM-APL-002]
    "ADR-S-OCM-001/I-08":
      text: Lysis V1 bytes are never reinterpreted as a common envelope.
      tests: [OCM-BYT-001, OCM-BND-001]
    "ADR-S-OCM-002/I-01":
      text: Event, Mongo, path and CAS name do not establish job authority.
      tests: [OCM-DIS-001, OCM-PIN-001, OCM-EXP-001, OCM-CAS-001]
    "ADR-S-OCM-002/I-02":
      text: Every consumed body matches identity and committed CE leaf.
      tests: [OCM-EXP-001, OCM-E2E-001]
    "ADR-S-OCM-002/I-03":
      text: Traversal reconstructs exact root, count and nominal.
      tests: [OCM-EXP-001, OCM-E2E-001]
    "ADR-S-OCM-002/I-04":
      text: Fidelity and Oracle values bind to job logical context.
      tests: [OCM-EXP-001, OCM-SEM-001, OCM-TIM-001]
    "ADR-S-OCM-002/I-05":
      text: Manifest names one JobId and one bundle.
      tests: [OCM-BYT-001, OCM-EXP-001]
    "ADR-S-OCM-002/I-06":
      text: Workers consume only digest-verified manifest members.
      tests: [OCM-CAS-001, OCM-DET-001]
    "ADR-S-OCM-002/I-07":
      text: Fork-orphaned input is never signable.
      tests: [OCM-PIN-001, OCM-E2E-005]
    "ADR-S-OCM-002/I-08":
      text: Export ambiguity abstains rather than reading best-effort live state.
      tests: [OCM-EXP-001, OCM-CAS-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-01":
      text: Equal finalized inputs and bundle produce byte-identical units and result.
      tests: [OCM-SEM-002, OCM-DET-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-02":
      text: Worker scheduling changes neither result nor evidence weight.
      tests: [OCM-DET-001, OCM-CRT-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-03":
      text: One validator index contributes at most one matching signature.
      tests: [OCM-CRT-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-04":
      text: OCOMP key is distinct and unavailable to compute processes.
      tests: [OCM-CTL-001, OCM-SIG-001, OCM-ISO-001]
    "ADR-S-OCM-003/I-05":
      text: Sign-once history is durable before signature release.
      tests: [OCM-SIG-001, OCM-E2E-001]
    "ADR-S-OCM-003/I-06":
      text: Certificate binds one exact typed result and job attempt.
      tests: [OCM-BYT-001, OCM-CRT-001, OCM-PUB-002]
    "ADR-S-OCM-003/I-07":
      text: Relay cannot turn mismatched or duplicate signatures into authority.
      tests: [OCM-CRT-001, OCM-PUB-002, OCM-E2E-001]
    "ADR-S-OCM-003/I-08":
      text: Quorum does not replace input completeness or independent semantics.
      tests: [OCM-SEM-001, OCM-EXP-001, OCM-E2E-001]
    "ADR-S-OCM-004/I-01":
      text: Request creation has no Lysis or owner effect.
      tests: [OCM-REQ-001, OCM-E2E-001]
    "ADR-S-OCM-004/I-02":
      text: Only a finalized live exact attempt can be signed or activated.
      tests: [OCM-FIN-001, OCM-PIN-001, OCM-SIG-001, OCM-PUB-002]
    "ADR-S-OCM-004/I-03":
      text: Activation at or after deadline cannot race expiry.
      tests: [OCM-FSM-001, OCM-PUB-003]
    "ADR-S-OCM-004/I-04":
      text: Evidence verification does not execute Lysis.
      tests: [OCM-BND-002, OCM-TRC-001]
    "ADR-S-OCM-004/I-05":
      text: Only private typed capability reaches effect methods.
      tests: [OCM-BND-001, OCM-APL-002]
    "ADR-S-OCM-004/I-06":
      text: All owner effects and terminal job commit together or not at all.
      tests: [OCM-APL-002, OCM-E2E-006]
    "ADR-S-OCM-004/I-07":
      text: Exact terminal retry is idempotent and different replay rejects.
      tests: [OCM-APL-002, OCM-PUB-004]
    "ADR-S-OCM-004/I-08":
      text: Old state remains authoritative until generation switch commits.
      tests: [OCM-FSM-001, OCM-APL-002, OCM-E2E-008]
    "ADR-S-OCM-004/I-09":
      text: No synchronous Lysis fallback exists in the PoC profile.
      tests: [OCM-FSM-001, OCM-E2E-001, OCM-TRC-001]
    "ADR-S-OCM-004/I-10":
      text: Local readiness and version cannot alter consensus validity.
      tests: [OCM-CTL-001, OCM-E2E-007]

