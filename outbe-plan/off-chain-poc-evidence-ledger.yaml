schema_version: 1
kind: outbe_ocomp_poc_planning_ledger
status: planned
note: >
  This file defines required future evidence. A planned test is not evidence
  that implementation or verification currently exists.

scope:
  fork_profile: OUTBE_OCOMP_POC_DEVNET_FORK_V1
  program: LYSIS_V1
  validator_domains: 4
  quorum: 3
  required_poc_ids: POC-01..POC-26
  required_pfs_ids: PFS-002-01..PFS-002-24
  story_steps: 1..13
  forbidden_shortcuts:
    - direct_activation_or_lysis_handler_for_public_claim
    - direct_consensus_state_injection
    - direct_ocomp_fixture_job_result_or_root_injection
    - mocked_validator_domain
    - central_calculator
    - mongo_or_cas_as_canonical_outcome
    - synchronous_post_fork_lysis_fallback
    - on_chain_lysis_as_reference_oracle
    - undocumented_manual_evidence

deferred:
  PFS-002-07:
    status: DEFERRED
    reason: BoundedMVP CE persistence and crash-recovery matrix
  PFS-002-08:
    status: DEFERRED
    reason: BoundedMVP long-timestamp and bounded backlog policy

lanes:
  OCM-FAST:
    command: mise run ocomp-poc-fast
    platform: linux
    frequency: every_relevant_pr
    timeout_minutes: 15
    required: true
    required_for: poc_closure
    automatic_retries: 0
  OCM-INT:
    command: mise run ocomp-poc-integration
    platform: linux_with_mongodb
    frequency: every_relevant_pr
    timeout_minutes: 30
    required: true
    required_for: poc_closure
    automatic_retries: 0
  OCM-PUBLIC:
    command: mise run ocomp-poc-public-path
    platform: fresh_four_node_localnet
    frequency: every_relevant_pr
    timeout_minutes: 45
    required: true
    required_for: poc_closure
    automatic_retries: 0
  OCM-E2E:
    command: mise run ocomp-poc-e2e -- --evidence-dir <dir>
    platform: privileged_linux_four_validator_mock_gramine
    frequency: closure_candidate_and_scheduled_main
    timeout_minutes: 120
    required: true
    required_for: poc_closure
    automatic_retries: 0
  OCM-ISO:
    command: mise run ocomp-poc-isolation -- --evidence-dir <dir>
    platform: systemd_cgroup_v2
    frequency: every_closure_candidate
    timeout_minutes: 60
    required: true
    required_for: poc_closure
    automatic_retries: 0
  OCM-VERIFY:
    command: mise run ocomp-poc-evidence-verify -- <manifest>
    platform: clean_linux
    frequency: every_evidence_bundle
    timeout_minutes: 15
    required: true
    required_for: poc_closure
    automatic_retries: 0

execution_modes:
  task_progress:
    command: mise run ocomp-poc-task -- <OCM-NN>
    success_claim: named_task_only
    require:
      - all_named_task_local_tests_pass
      - all_closing_test_ids_owned_by_named_task_pass
      - every_discovered_ocomp_test_passes
      - no_discovered_skip_todo_quarantine_or_retry
    future_planned_ids: MISSING
    future_missing_is_not_poc_success: true
  poc_closure:
    command: mise run ocomp-poc-closure -- --evidence-dir <dir>
    success_claim: complete_poc_evidence_only
    require:
      - every_required_lane_passes_on_one_exact_artifact_set
      - every_non_deferred_test_id_is_discovered_and_passes
      - no_missing_skip_todo_quarantine_retry_timeout_or_infra_error

oracle_policy:
  allowed:
    - CANONICAL_BYTES
    - REFERENCE_DIFF
    - FSM_MODEL
    - FINALITY_PROOF
    - FINALIZED_PUBLIC_STATE
    - PUBLIC_TX_RECEIPT
    - STATE_ROOT_DIFF
    - PROCESS_BOUNDARY
    - DURABLE_JOURNAL
    - DIGESTED_ARTIFACT
    - RESOURCE_COUNTER
    - STATIC_BOUNDARY
    - RUNTIME_BOUNDARY_TRACE
  mandatory_statuses:
    - PASS
  non_proving_statuses:
    - FAIL
    - INFRA_ERROR
    - TIMEOUT
    - SKIPPED
    - MISSING
    - DEFERRED

runtime_evidence:
  schema_version: 1
  manifest_name: run-manifest.json
  publish_last: true
  member_hash: sha256_exact_bytes
  required_sections:
    - source_and_toolchain
    - exact_binary_hashes
    - exact_config_and_service_unit_hashes
    - genesis_fork_bundle_and_profiles
    - test_discovery
    - machine_and_service_topology
    - scenario_records
    - block_transaction_receipt_and_finality_refs
    - protocol_and_transport_digests
    - public_queries_and_proofs
    - process_and_forbidden_call_traces
    - negative_assertions
    - skip_todo_quarantine_retry_and_timeout_records
    - member_hash_index_and_retention
  assertion_required_fields:
    - assertion_id
    - test_id
    - status
    - oracle
    - expected_artifact_refs
    - actual_artifact_refs
    - observed_at
  forbidden_content:
    - private_keys
    - production_secrets
    - nondeterministic_user_payloads
    - unrestricted_database_or_log_dumps

