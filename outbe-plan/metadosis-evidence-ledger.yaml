schema_version: 1
kind: outbe_metadosis_citadel_evidence_ledger
status: implemented_evidence_pending
note: >
  This pack declares the exact production-interface tests required to close
  CITADEL-001..008. It does not claim production proof until one clean,
  exact-revision Linux evidence set passes the generic verifier.

verification:
  schema_version: 1
  namespace: METADOSIS
  evidence_identity:
    exact_revision: true
    artifact_profile: OUTBE_OCOMP_POC_DEVNET_FORK_V1
    linux_lane: METADOSIS-LINUX
    require_clean_tracked_tree: true
    require_clean_untracked_tree: true
  closure_policy:
    require_all_required_tests: true
    reject_ignored_or_skipped: true
    reject_unknown_tests: true

lanes:
  METADOSIS-LINUX:
    platform: x86_64-unknown-linux-gnu
    operating_system: Ubuntu 24.04
    image_digest_policy: exact_value_from_evidence_manifest
    build_profile: debug_and_release
    required: true
    automatic_retries: 0
    note: >
      The external closure runner must supply the immutable image digest. A
      checked-in placeholder digest is intentionally not treated as evidence.

