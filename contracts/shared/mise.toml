# Deploy tasks load NETWORK and other vars from an env file.
# Override ENV_FILE to use a different environment, e.g.:
#   ENV_FILE=.bsc-testnet.env mise run deploy-create3-factory

[tasks.install]
description = "Install dependencies using soldeer"
run = "forge soldeer install"

[tasks.build]
description = "Build Solidity contracts using forge"
run = "forge build"

[tasks.fmt]
description = "Format Solidity code"
run = "forge fmt"

[tasks.deploy-create3-factory]
description = "Deploy the CREATE3 factory shared by every contracts/* project (idempotent)"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
forge script script/DeployCreate3Factory.s.sol:DeployCreate3Factory --rpc-url "$NETWORK" --broadcast --verify --slow --legacy -vvv
'''

