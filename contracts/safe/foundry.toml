[profile.default]
  src = "src"
  out = "out"
  script = "script"
  libs = ["dependencies"]
  solc = "0.8.30"
  evm_version = "Prague"
  bytecode_hash = "none"
  cbor_metadata = false
  optimizer = true
  optimizer_runs = 10_000
  via_ir = true
  remappings = [
    "forge-std/=dependencies/forge-std-1.16.1/src/",
    "safe-smart-account/=dependencies/safe-smart-account-1.5.0/",
  ]

[rpc_endpoints]
  outbe-testnet = "https://rpc.testnet.outbe.net"

[soldeer]
remappings_generate = false

[dependencies]
forge-std = { version = "1.16.1", git = "https://github.com/foundry-rs/forge-std", rev = "b3bc8b154382a75d0b0ef22d7fd4a0a5f0feee0e" }
safe-smart-account = { version = "1.5.0", git = "https://github.com/safe-fndn/safe-smart-account", rev = "dc437e8fba8b4805d76bcbd1c668c9fd3d1e83be" }
