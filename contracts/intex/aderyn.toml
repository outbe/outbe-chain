version = 1

root = "./."
src = "src/"

exclude = [
    "/archive/",
    "/vendor/",
    "/Mock",
]

[detectors]
exclude = [
    # every UUPS proxy has a payable upgradeToAndCall and forwards all other native value
    "contract-locks-ether",
    # native value only goes to the hub, the token bridge, IntexFactory or back to the caller as a fee refund
    "eth-send-unchecked-address",
    # every flagged call goes to a contract of the stack or is a view call
    "reentrancy-state-change",
]

[env]
