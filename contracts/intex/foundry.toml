[profile.default]
solc_version = '0.8.30'
evm_version = 'Prague'
bytecode_hash = 'none'
cbor_metadata = false
src = 'src'
out = 'out'
test = 'test/foundry'
script = 'deploy'
cache_path = 'cache/foundry'
verbosity = 3
optimizer = true
optimizer_runs = 200
via_ir = true
# Build info + storage layout for the upgrades-core layout validator.
build_info = true
extra_output = ['storageLayout']
libs = ['dependencies']
# @shared and @precompiles sources live outside this project.
allow_paths = ['../shared/src', '../precompiles/src']
# Genesis predeploy runtime code, etched by the refund gas measurement.
fs_permissions = [{ access = 'read', path = '../predeploys' }]

remappings = [
    # Contract imports from tests
    '@contracts/=src/',
    '@test-mocks/=test/mocks/',
    '@precompiles/=../precompiles/src/',
    '@shared/=../shared/src/',
    'forge-std/=dependencies/forge-std-1.16.1/src/',
    '@openzeppelin/contracts/=dependencies/openzeppelin-contracts-5.6.1/contracts/',
    '@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.6.1/',
]

[fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1000 }

[soldeer]
# Remappings are maintained by hand in foundry.toml; do not let soldeer overwrite them.
remappings_generate = false

[dependencies]
forge-std = { version = "1.16.1", git = "https://github.com/foundry-rs/forge-std", rev = "b3bc8b154382a75d0b0ef22d7fd4a0a5f0feee0e" }
openzeppelin-contracts = { version = "5.6.1", git = "https://github.com/OpenZeppelin/openzeppelin-contracts", rev = "5a3b28fc5bd3976da5ea38d90d88ba26f1e0a335" }
"@openzeppelin-contracts-upgradeable" = "5.6.1"
