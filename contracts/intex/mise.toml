[tools]
uv = "0.5.18"

[tasks.install]
description = "Install dependencies using soldeer"
run = "forge soldeer install"

[tasks.build]
description = "Build Solidity contracts using forge"
run = "forge build"

[tasks.test]
description = "Test Solidity contracts using forge"
run = "forge test"

[tasks.fmt]
description = "Format Solidity code"
run = "forge fmt"

[tasks.lint]
description = "Lint Solidity code (forge lint)"
run = "forge lint"

[tasks.export-abi]
description = "Export the contract and interface ABIs to ./abi-export"
depends = ["build"]
run = '''
set -eu
mkdir -p ./abi-export
rm -f ./abi-export/*.json
for target in \
  src/shared/IntexNFT1155.sol:IntexNFT1155 \
  src/shared/interfaces/IIntexNFT1155.sol:IIntexNFT1155 \
  src/shared/IntexNFT1155Router.sol:IntexNFT1155Router \
  src/shared/interfaces/IIntexNFT1155Router.sol:IIntexNFT1155Router \
  src/target/EscrowAdapter.sol:EscrowAdapter \
  src/target/interfaces/IEscrowAdapter.sol:IEscrowAdapter \
  src/target/IntexAuction.sol:IntexAuction \
  src/target/interfaces/IIntexAuction.sol:IIntexAuction \
  src/target/IntexAuctionTargetRouter.sol:IntexAuctionTargetRouter \
  src/target/interfaces/IIntexAuctionTargetRouter.sol:IIntexAuctionTargetRouter; do
  forge inspect "$target" abi --json > "./abi-export/${target##*:}.json"
done
'''

[tasks.predict-addresses]
description = "Print the CREATE3 address of every Intex proxy for the current salt"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
forge script script/PredictAddresses.s.sol:PredictAddresses --rpc-url "$NETWORK" -vvv
'''

[tasks.deploy-all]
description = "Deploy the five Intex contracts on one chain (after Hyperlane knows it)"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
forge script script/DeployAll.s.sol:DeployAll --rpc-url "$NETWORK" --broadcast --slow --legacy -vvv --skip-simulation
'''

[tasks.hand-over]
description = "Give every Intex contract to governance (run last, after deploy-all)"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
forge script script/6_HandOver.s.sol:HandOver --rpc-url "$NETWORK" --broadcast --slow --legacy -vvv --skip-simulation
'''

[tasks.prepare-upgrade]
description = "Deploy new Intex implementations and print the upgradeContracts payload"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
forge script script/PrepareUpgrade.s.sol:PrepareUpgrade --rpc-url "$NETWORK" --broadcast --slow --legacy -vvv --skip-simulation
'''

[tasks.clean]
description = "Clean up forge artifacts"
run = "forge clean"

[tasks.clean-all]
description = "Clean all build artifacts, and caches"
depends = ["clean"]
run = '''
forge soldeer clean
rm -rf ./out ./cache ./lcov.info
'''
