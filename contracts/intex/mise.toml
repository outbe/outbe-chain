[tools]
uv = "0.5.18"

[tools."github:Cyfrin/aderyn"]
version = "aderyn-v0.6.8"

[tools."github:Cyfrin/aderyn".platforms.macos-arm64]
bin_path = "aderyn-aarch64-apple-darwin"

[tools."github:Cyfrin/aderyn".platforms.macos-x64]
bin_path = "aderyn-x86_64-apple-darwin"

[tools."github:Cyfrin/aderyn".platforms.linux-x64]
bin_path = "aderyn-x86_64-unknown-linux-gnu"

[tools."github:Cyfrin/aderyn".platforms.linux-arm64]
bin_path = "aderyn-aarch64-unknown-linux-gnu"

[tasks.install]
description = "Install dependencies using soldeer"
run = "forge soldeer install"

[tasks.build]
description = "Build Solidity contracts using forge"
run = "forge build"

[tasks.test]
description = "Test Solidity contracts using forge"
run = "forge test"

[tasks.fmt]
description = "Format Solidity code"
run = "forge fmt"

[tasks.lint]
description = "Lint Solidity code (forge lint)"
run = "forge lint"

[tasks.export-abi]
description = "Export the contract and interface ABIs to ./abi-export"
depends = ["build"]
run = '''
set -eu
mkdir -p ./abi-export
rm -f ./abi-export/*.json
for target in \
  src/origin/OriginRouter.sol:OriginRouter \
  src/origin/interfaces/IOriginRouter.sol:IOriginRouter \
  src/shared/IntexNFT1155.sol:IntexNFT1155 \
  src/shared/interfaces/IIntexNFT1155.sol:IIntexNFT1155 \
  src/shared/IntexNFT1155Bridge.sol:IntexNFT1155Bridge \
  src/shared/interfaces/IIntexNFT1155Bridge.sol:IIntexNFT1155Bridge \
  src/target/EscrowAdapter.sol:EscrowAdapter \
  src/target/interfaces/IEscrowAdapter.sol:IEscrowAdapter \
  src/target/IntexAuction.sol:IntexAuction \
  src/target/interfaces/IIntexAuction.sol:IIntexAuction \
  src/target/TargetRouter.sol:TargetRouter \
  src/target/interfaces/ITargetRouter.sol:ITargetRouter; do
  forge inspect "$target" abi --json > "./abi-export/${target##*:}.json"
done
'''

[tasks.clean]
description = "Clean up forge artifacts"
run = "forge clean"

[tasks.clean-all]
description = "Clean all build artifacts, and caches"
depends = ["clean"]
run = '''
forge soldeer clean
rm -rf ./out ./cache ./lcov.info
'''
