# Prometheus / Alertmanager alert rules for outbe-chain validator hosts.
#
# This file is a TEMPLATE. Copy it to the operator's actual rule
# directory (e.g. /etc/prometheus/rules/outbe-chain.yaml) and adjust
# label selectors / hosts / contacts as needed.
#
# Wire metrics: Reth --metrics adds reth_ to emitted names
# (reth_outbe_<subsystem>_* and reth_process_*).
# Source metrics:
#   - reth_outbe_consensus_metrics_exporter_up
#       consensus exporter startup bind status (1=bound, 0=bind failed).
#   - reth_outbe_consensus_block_cache_entries
#       process-local block_cache entry count
#       (emitted from `crates/blockchain/consensus/src/metrics.rs`
#        and updated on every bounded insert + finalization eviction).
#   - reth_process_resident_memory_bytes
#       Reth's standard per-process RSS gauge.
#   - reth_outbe_consensus_tracked_peers
#       current tracked Commonware consensus peer-set size (membership,
#       NOT live TCP connections - it does not drop on disconnect).
#   - reth_outbe_consensus_current_view / reth_outbe_consensus_finalized_view
#       highest observed Simplex view vs last finalized view. The gap is the
#       primary consensus-stall signal: views advancing but nothing finalizing.
#   - reth_outbe_consensus_views_nullified_total
#       count of nullified (view-timed-out / skipped) views.
#
# Constants used here mirror the Rust source of truth:
#   BLOCK_CACHE_MAX_ENTRIES = 1024
#   (see `crates/blockchain/consensus/src/finalization/actor.rs`)
#
# This template has no alert for the MDBX `read transaction has been open for too long` warning.
# The `reth-db` `MetricsHandler` emits this warning, which currently has no Prometheus counter.
# Capture it through the operator's log pipeline (Loki / journald-based alerting).
# Track Rust-side counter exposure in a separate task.

groups:
  - name: outbe-chain.consensus
    interval: 30s
    rules:
      - alert: OutbeEquivocationEvidenceVerified
        expr: increase(reth_outbe_consensus_equivocation_verify_total{result="verified"}[5m]) > 0
        labels:
          severity: critical
          subsystem: consensus
        annotations:
          summary: "verified equivocation on {{ $labels.instance }} (kind={{ $labels.kind }})"
          description: |
            Conflicting consensus votes passed cryptographic verification.
            Investigate the consensus evidence and automatic slashing pipeline.
            Invalid signatures and malformed P2P evidence do not trigger this alert.

      - alert: OutbeConsensusVoteWithheldSpike
        expr: sum(increase(reth_outbe_consensus_vote_withheld_total[5m])) > 5
        labels:
          severity: warning
          subsystem: consensus
        annotations:
          summary: "consensus votes withheld more than 5 times in 5 minutes"
          description: |
            Check withheld-vote reasons and verification failures before investigating consensus liveness.

      - alert: OutbeConsensusMetricsExporterBindFailed
        expr: reth_outbe_consensus_metrics_exporter_up == 0
        for: 1m
        labels:
          severity: warning
          subsystem: consensus
        annotations:
          summary: "consensus metrics exporter failed to bind on {{ $labels.instance }}"
          description: |
            --consensus.metrics-addr failed to bind at startup while consensus
            continues running. Check the configured address and port availability.

      # Soft warning: cache approaching the hard cap. Indicates either
      # a sustained wedge (no finalization advancing) or fork spam.
      - alert: OutbeBlockCacheNearCap
        expr: reth_outbe_consensus_block_cache_entries > 0.9 * 1024
        for: 5m
        labels:
          severity: warning
          subsystem: consensus
        annotations:
          summary: "block_cache near max entries on {{ $labels.instance }}"
          description: |
            reth_outbe_consensus_block_cache_entries = {{ $value }} (>= 90% of 1024).
            Either consensus cannot advance finalization or
            the network is producing many same-height forks. Investigate
            via logs and `reth_outbe_consensus_tip_height` /
            `reth_outbe_consensus_finalized_view`.

      # Hard alarm: cache remains at the cap for an extended period.
      # Eviction continues, but the underlying condition (wedge or fork spam) persists.
      - alert: OutbeBlockCacheAtCap
        expr: reth_outbe_consensus_block_cache_entries >= 1024
        for: 15m
        labels:
          severity: critical
          subsystem: consensus
        annotations:
          summary: "block_cache pinned at MAX_ENTRIES on {{ $labels.instance }} for >15m"
          description: |
            reth_outbe_consensus_block_cache_entries remains at or above
            BLOCK_CACHE_MAX_ENTRIES (1024) for 15 minutes. This is
            survivable (eviction still runs) but indicates a sustained
            problem - wedge or fork spam - that the operator must
            investigate now.

      # Network split early-warning: empty tracked peer set. The May
      # 2026 OOM incident root cause was this condition going unnoticed
      # for hours. This metric measures tracked-set membership, not live connectivity.
      # Use it with the stall alert below. That alert uses the finalization gap
      # to detect connectivity loss that the membership count cannot detect.
      - alert: OutbeConsensusPeerSetEmpty
        expr: reth_outbe_consensus_tracked_peers == 0
        for: 5m
        labels:
          severity: critical
          subsystem: consensus
        annotations:
          summary: "validator {{ $labels.instance }} has an empty tracked peer set for >5m"
          description: |
            reth_outbe_consensus_tracked_peers == 0 for 5 minutes. The
            validator has no tracked consensus peers and cannot finalize. Check
            P2P reachability, known-peers.json, and bootnode pingability.

      # Primary consensus-stall alarm (M-20): views are advancing but nothing
      # is finalizing. This alarm uses the live finalization gap.
      # It detects connectivity loss, a leader-timeout storm, or a wedge,
      # even while the tracked peer set looks healthy.
      - alert: OutbeConsensusStalled
        expr: (reth_outbe_consensus_current_view - reth_outbe_consensus_finalized_view) > 20
        for: 2m
        labels:
          severity: critical
          subsystem: consensus
        annotations:
          summary: "consensus stalled on {{ $labels.instance }}: views advancing, no finalization"
          description: |
            reth_outbe_consensus_current_view - reth_outbe_consensus_finalized_view = {{ $value }} (> 20) for
            2 minutes. Views are progressing but no view is finalizing - a
            liveness fault (lost connectivity, a byzantine/offline leader run,
            or a wedge). Cross-reference rate(reth_outbe_consensus_views_nullified_total[5m])
            and the `outbe::reporter` / `outbe::consensus` log targets.

      # View-timeout storm: leaders are repeatedly failing to deliver proposals
      # in time, nullifying views. A sustained rate degrades liveness even if
      # the chain has not fully stalled yet.
      - alert: OutbeViewNullificationStorm
        expr: rate(reth_outbe_consensus_views_nullified_total[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
          subsystem: consensus
        annotations:
          summary: "high view-nullification rate on {{ $labels.instance }}"
          description: |
            rate(reth_outbe_consensus_views_nullified_total[5m]) = {{ $value }} (> 0.2/s) for
            5 minutes. Leaders are repeatedly timing out before delivering
            proposals (network turbulence or an offline/byzantine leader run).
            Finalization continues but with degraded liveness.

  - name: outbe-chain.host
    interval: 30s
    rules:
      # Memory pressure early-warning: gives the operator hours of
      # headroom to investigate before OOM. Threshold sized for the
      # current 7.8 GiB hosts. Raise to ~12 GiB after the RAM upgrade.
      - alert: OutbeChainHighRSS
        expr: reth_process_resident_memory_bytes{job=~".*outbe.*"} > 6 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          subsystem: host
        annotations:
          summary: "outbe-chain RSS > 6 GiB on {{ $labels.instance }}"
          description: |
            outbe-chain process RSS = {{ $value | humanize1024 }} for
            10 minutes. Historical OOM events on production hosts
            killed the process at ~7.1 GiB anon-rss. This threshold
            gives ~1 GiB headroom to investigate before OOM.

  - name: outbe-chain.slashing
    interval: 30s
    rules:
      # Early-warning before a felony fires. Threshold values match
      # `slashindicator::constants::DEFAULT_PROPOSER_FELONY_THRESHOLD` (128).
      # Adjust for network overrides reported by outbe_getSlashConfig.
      # Fire when miss count exceeds 80% of the threshold.
      - alert: OutbeProposerMissNearFelony
        expr: reth_outbe_slashing_proposer_misses > 102.4
        for: 2m
        labels:
          severity: warning
          subsystem: slashing
        annotations:
          summary: "validator {{ $labels.addr }} approaching proposer felony"
          description: |
            reth_outbe_slashing_proposer_misses = {{ $value }} for {{ $labels.addr }}.
            Default felony threshold is 128 - at this rate the validator
            will be jailed and slashed soon. Investigate node health.

      # Validator just transitioned to EXITING (status code 3). This
      # means a slash or voluntary deactivation just happened.
      - alert: OutbeValidatorExiting
        expr: reth_outbe_validatorset_validator_status == 3
        for: 1m
        labels:
          severity: critical
          subsystem: slashing
        annotations:
          summary: "validator {{ $labels.addr }} is EXITING"
          description: |
            Validator {{ $labels.addr }} transitioned to EXITING status.
            Cause is either a felony, evidence-based slash, or voluntary
            deactivation. Check `outbe::slashing` / `outbe::validatorset`
            log target for the triggering event.

      # Validator transitioned to UNBONDING. Permanent exit from
      # consensus participation.
      - alert: OutbeValidatorUnbonding
        expr: reth_outbe_validatorset_validator_status == 4
        for: 1m
        labels:
          severity: critical
          subsystem: slashing
        annotations:
          summary: "validator {{ $labels.addr }} is UNBONDING"
          description: |
            Validator {{ $labels.addr }} transitioned to UNBONDING.
            Permanent exit from consensus until re-registration after
            cooldown. See `outbe::validatorset` log target for transition.

      - alert: OutbeEquivocationSubmitFailed
        expr: increase(reth_outbe_slashing_equivocation_submit_failed_total[5m]) > 0
        labels:
          severity: warning
          subsystem: slashing
        annotations:
          summary: "equivocation submission failed on {{ $labels.instance }}"
          description: |
            Check the reason label, state provider, and local transaction pool errors.
            If evm-key.hex is shared with outbe-feeder, check sender nonce contention
            and ReplacementUnderpriced errors. Consider a separate key delegated
            ValidatorDelegateRole::Oracle for outbe-feeder to avoid contention.

      # Slash event just happened (any reason). Treats the slash as a
      # signal that needs human attention.
      - alert: OutbeValidatorSlashed
        expr: rate(reth_outbe_slashing_validator_slashed_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          subsystem: slashing
        annotations:
          summary: "validator {{ $labels.addr }} slashed (reason={{ $labels.reason }})"
          description: |
            reth_outbe_slashing_validator_slashed_total incremented for
            {{ $labels.addr }} (reason={{ $labels.reason }}). Full
            forensic context lives under the `outbe::slashing` log
            target.

      # Felony count is a gauge; use its delta to detect a rise.
      - alert: OutbeFelonyCountIncreased
        expr: delta(reth_outbe_slashing_felonies[5m]) > 0
        for: 0m
        labels:
          severity: warning
          subsystem: slashing
        annotations:
          summary: "felony count rose for {{ $labels.addr }}"
          description: |
            reth_outbe_slashing_felonies rose by {{ $value }} for {{ $labels.addr }}.
            A positive gauge delta indicates a new felony just
            fired. Cross-reference `reth_outbe_slashing_validator_slashed_total`
            with the corresponding `reason` label.

  - name: outbe-chain.validatorset
    interval: 30s
    rules:
      # Active validator count dropped. f+1 or worse may halt finalization.
      - alert: OutbeActiveValidatorCountDropped
        expr: reth_outbe_validatorset_active_validators < 4
        for: 5m
        labels:
          severity: critical
          subsystem: validatorset
        annotations:
          summary: "active validator count = {{ $value }}"
          description: |
            reth_outbe_validatorset_active_validators fell below the 4-validator
            minimum quorum needed for healthy finalization. Investigate
            recent EXITING / UNBONDING transitions.

      # The next reshare did not resolve a pending validator-set change.
      # This may indicate stuck DKG or operator inattention.
      - alert: OutbeValidatorSetChangePending
        expr: reth_outbe_validatorset_set_change_pending == 1
        for: 30m
        labels:
          severity: warning
          subsystem: validatorset
        annotations:
          summary: "validator-set change pending for >30 min"
          description: |
            reth_outbe_validatorset_set_change_pending remains 1 for over 30 minutes.
            A reshare should have completed by now.
            Check DKG progress and validator availability.

  # --- Resident TEE observability ---
  # Wire metrics include the Reth --metrics reth_ prefix. Resident dispatch
  # emits request duration/errors and execution activity; canary emits decrypt
  # latency, consecutive failures and the last successful probe timestamp.
  - name: outbe-chain.tee
    interval: 30s
    rules:
      - alert: OutbeTeeExecutionLockContentionHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(reth_outbe_tee_client_execution_lock_wait_ms_bucket[5m]))) > 100
        for: 5m
        labels:
          severity: warning
          subsystem: tee
        annotations:
          summary: "TEE execution lock p99 wait exceeds 100ms"
          description: |
            Execution dispatch wait is increasing; check concurrent execution load.

      - alert: OutbeTeeCanaryFailing
        expr: reth_outbe_tee_canary_consecutive_failures >= 3
        for: 2m
        labels:
          severity: critical
          subsystem: tee
        annotations:
          summary: "TEE canary decrypt failing on {{ $labels.instance }}"
          description: |
            The enclave canary failed 3+ consecutive probes.
            issueNod execution on this validator is degraded or broken.
            With a small committee, this slows every block (see the 2026-08-22 incident).

      - alert: OutbeTeeCanaryStale
        expr: time() - reth_outbe_tee_canary_last_ok_timestamp_seconds > 300
        labels:
          severity: critical
          subsystem: tee
        annotations:
          summary: "no successful TEE canary for >5 min on {{ $labels.instance }}"

      - alert: OutbeTeeCanaryLatencyHigh
        # install_outbe_prometheus_recorder uses Matcher::Suffix("_ms")
        # to guarantee histogram _bucket series for this latency metric.
        expr: histogram_quantile(0.99, sum by (le) (rate(reth_outbe_tee_canary_latency_ms_bucket[10m]))) > 250
        for: 10m
        labels:
          severity: warning
          subsystem: tee
        annotations:
          summary: "TEE canary p99 latency >250ms on {{ $labels.instance }}"
          description: |
            Consensus-path decrypt latency is increasing. At ~seconds per call a
            single validator can stall every view (36 s/block incident mode).

  # --- Transaction pool eviction (2026-08-22 incident follow-up) ---
  #
  # Wire metrics below include the Reth --metrics reth_ prefix.
  # Source metrics (emitted by the node-side pool maintenance loop in
  # `crates/blockchain/txpool/src/maintain.rs`):
  #   reth_outbe_txpool_stale_evicted_total   - transactions evicted after
  #                                             surviving two consecutive pending
  #                                             snapshots (plus their descendants)
  #   reth_outbe_txpool_pending_snapshot_txs  - pending-set size at the last snapshot
  #
  # Steady state is zero evictions. The network mines a healthy transaction long
  # before the staleness interval elapses. Sustained evictions mean transactions
  # enter the pool, but the network cannot include them. This indicates a stuck
  # transaction pattern, repeated builder omissions, or a validator too slow
  # to finalize the proposals that contain them.
  - name: outbe-chain.txpool
    interval: 30s
    rules:
      - alert: OutbeTxPoolInclusionStallAlarm
        expr: increase(reth_outbe_txpool_inclusion_alarms_total[5m]) > 0
        labels:
          severity: warning
          subsystem: txpool
        annotations:
          summary: "transaction pool inclusion stalled on {{ $labels.instance }}"
          description: |
            Check the alarm kind, queued transactions, and user transaction inclusion in canonical blocks.

      - alert: OutbeCanonicalTipStale
        expr: reth_outbe_txpool_canonical_tip_age_seconds > 60
        labels:
          severity: warning
          subsystem: txpool
        annotations:
          summary: "canonical tip is more than 60 seconds old on {{ $labels.instance }}"
          description: |
            Check canonical chain progress and whether consensus finalization or execution has stalled.

      - alert: OutbeTxpoolSustainedStaleEviction
        expr: increase(reth_outbe_txpool_stale_evicted_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          subsystem: txpool
        annotations:
          summary: "pool is shedding stale transactions on {{ $labels.instance }}"
          description: |
            For 15 minutes, the pool repeatedly evicts transactions that remain pending across two snapshots.
            Check whether one transaction repeatedly enters the pool through gossip or reorg re-injection.
            Check whether block time increased.

      - alert: OutbeTxpoolPendingBacklog
        # Well below the 10k pending sub-pool cap. A sustained backlog on a
        # low-traffic chain means the pool does not drain transactions.
        expr: reth_outbe_txpool_pending_snapshot_txs > 1000
        for: 15m
        labels:
          severity: warning
          subsystem: txpool
        annotations:
          summary: "pending pool backlog above 1000 for 15 minutes"

  - name: outbe-chain.follower
    interval: 30s
    rules:
      - alert: OutbeFollowerUpstreamUnreachable
        expr: reth_outbe_follower_upstream_tip_known == 0 and on(instance) reth_outbe_consensus_operating_mode <= 1
        for: 2m
        labels:
          severity: warning
          subsystem: follower
        annotations:
          summary: "follower upstream is unreachable on {{ $labels.instance }}"
          description: |
            Only follower and upstream-bootstrap modes require upstream freshness; check the upstream RPC.

  - name: outbe-chain.p2p
    interval: 30s
    rules:
      - alert: OutbeP2pSendRateLimited
        expr: sum by (channel) (increase(reth_outbe_p2p_send_rate_limited_total[5m])) > 10
        labels:
          severity: warning
          subsystem: p2p
        annotations:
          summary: "P2P channel {{ $labels.channel }} rate-limited more than 10 sends in 5 minutes"
          description: |
            Check channel traffic and peer rate limits; local send rejection does not prove remote delivery.
