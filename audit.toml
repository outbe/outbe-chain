# cargo-audit configuration. Mirrors the advisory ignores in deny.toml.
#
# All entries are transitive deps pulled in by upstream crates (reth v2.8.1 /
# commonware / heartwood) and cannot be upgraded away without upstream changes.
# Revisit when upstreams bump the affected dependencies.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained
    "RUSTSEC-2023-0071", # rsa Marvin timing sidechannel (Heartwood ssh-key; Outbe uses Ed25519)
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 via elliptic-curve 0.13.8
    "RUSTSEC-2026-0391", # zstd 0.13 pinned upstream
    "RUSTSEC-2026-0398", # zstd-safe 7 pinned upstream
    "RUSTSEC-2026-0403", # zstd-safe 7 pinned upstream
    "RUSTSEC-2026-0418", # libz-sys <= 1.1.30 only affected with cc >= 1.6.0 (workspace resolves cc 1.4.5)
]
