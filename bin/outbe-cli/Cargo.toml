[package]
name = "outbe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
local-e2e = []
native-dcap = ["outbe-tee/native-dcap"]

[[bin]]
name = "outbe-cli"
path = "src/main.rs"

[dependencies]
outbe-system-common.workspace = true
# Alloy (ABI encoding + primitives)
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-eips.workspace = true
outbe-simplex.workspace = true
outbe-primitives.workspace = true
blst.workspace = true
commonware-codec.workspace = true
commonware-cryptography.workspace = true
radicle-crypto = { workspace = true, features = ["ssh"] }
outbe-zerofee.workspace = true
outbe-zk.workspace = true
# TEE public status and owner-local offer encryption.
outbe-tee.workspace = true
outbe-core-common.workspace = true
outbe-update.workspace = true

# CLI
clap = { workspace = true, features = ["string"] }

# HTTP / JSON-RPC
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

# Signing
k256.workspace = true

# Async
tokio.workspace = true

# Utilities
hex.workspace = true
eyre.workspace = true
libc.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tempfile.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
reth-node-core.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
outbe-rpc = { workspace = true, features = ["test-support"] }
outbe-tee = { workspace = true, features = ["test-utils"] }
commonware-math.workspace = true
rand-commonware.workspace = true
rand-core-commonware.workspace = true

[lints]
workspace = true
