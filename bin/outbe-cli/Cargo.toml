[package]
name = "outbe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Accept only the devnet software seal produced by the separate E2E binary.
local-e2e = []

[[bin]]
name = "outbe-cli"
path = "src/main.rs"

[dependencies]
# Alloy (ABI encoding + primitives)
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-eips.workspace = true
outbe-simplex.workspace = true
outbe-primitives.workspace = true
blst.workspace = true
commonware-codec.workspace = true
commonware-cryptography.workspace = true
radicle-crypto = { workspace = true, features = ["ssh"] }
outbe-zerofee.workspace = true
outbe-zk.workspace = true
# TEE enclave client + wire protocol (the `tee join` offer-key registration).
outbe-tee = { workspace = true, features = ["native-dcap"] }
outbe-update.workspace = true

# CLI
clap = { workspace = true, features = ["string"] }

# HTTP / JSON-RPC
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

# Signing
k256.workspace = true

# Async
tokio.workspace = true

# Utilities
hex.workspace = true
eyre.workspace = true
libc.workspace = true
rustix.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tempfile.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
outbe-rpc = { workspace = true, features = ["test-support"] }
outbe-tee = { workspace = true, features = ["test-utils", "native-dcap"] }
commonware-math.workspace = true
rand-commonware.workspace = true
rand-core-commonware.workspace = true
snow.workspace = true

[lints]
workspace = true
