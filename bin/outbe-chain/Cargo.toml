[package]
name = "outbe-chain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
production-enclave = ["outbe-runtime/production-enclave"]
snapshot-integration = ["outbe-runtime/snapshot-integration"]
test-marshal-drop = ["outbe-consensus/test-marshal-drop"]
e2e-test = ["outbe-runtime/e2e-test", "outbe-consensus/e2e-byzantine-preannounce"]
test-protocol-overrides = [
    "outbe-chain-constants/test-protocol-overrides",
    "outbe-consensus/test-protocol-overrides",
]

[[bin]]
name = "outbe-chain"
path = "src/main.rs"

[dependencies]
outbe-chain-constants.workspace = true
outbe-runtime.workspace = true
outbe-snapshot.workspace = true
outbe-consensus.workspace = true
outbe-primitives.workspace = true
outbe-tee.workspace = true

reth-ethereum = { workspace = true, features = ["node", "cli"] }
reth-chainspec.workspace = true
reth-cli.workspace = true
reth-provider.workspace = true
reth-rpc-server-types.workspace = true

alloy-primitives.workspace = true
alloy-consensus.workspace = true
clap.workspace = true
eyre.workspace = true
hex.workspace = true
k256.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tar.workspace = true
reth-primitives-traits.workspace = true

[dev-dependencies]
outbe-nodfactory = { workspace = true, features = ["test-utils"] }
outbe-consensus = { workspace = true, features = ["test-utils"] }
outbe-teeregistry.workspace = true
outbe-validatorset = { workspace = true, features = ["test-utils"] }
commonware-codec.workspace = true
commonware-cryptography.workspace = true
postcard.workspace = true
reth-chain-state.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
commonware-consensus.workspace = true
commonware-storage.workspace = true
commonware-utils.workspace = true
reqwest.workspace = true

[build-dependencies]
vergen = { version = "10.0.1", features = ["build", "cargo", "emit_and_set"] }
vergen-git2 = "10.0.1"

[[test]]
name = "snapshot_create"
path = "tests/snapshot_create.rs"
required-features = ["snapshot-integration"]

[[test]]
name = "snapshot_files"
path = "tests/snapshot_files.rs"
required-features = ["snapshot-integration"]

[[test]]
name = "snapshot_validate"
path = "tests/snapshot_validate.rs"
required-features = ["snapshot-integration"]

[lints]
workspace = true
