# Minimal four-founder test network. Multiple VM validators may share one bare-metal machine.
# This workflow uses in-process TEE without attestation and is limited to devnet and testnet.
version: 2
name: outbe-testnet
network: testnet
chain_id: 54322345
certified_rpc: "https://rpc.testnet.outbe.net"

machines:
  fr5:
    public_ip: 203.0.113.10
    ssh_user: ubuntu
    # ssh_port: 22
    # vm_ssh_user: root
  fr6:
    public_ip: 203.0.113.20
    ssh_user: ubuntu

founders:
  - name: validator-0
    machine: fr5
    private_ip: 10.77.0.11
    publish_rpc: true
  - name: validator-1
    machine: fr5
    private_ip: 10.77.0.12
  - name: validator-2
    machine: fr6
    private_ip: 10.77.0.11
  - name: validator-3
    machine: fr6
    private_ip: 10.77.0.12

hyperlane:
  gasless: true
  origins:
    - domain: 54322345
      rpc_urls:
        - "https://rpc.testnet.outbe.net"
      reorg_period: 0
    - domain: 97
      rpc_urls:
        - "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
        - "https://data-seed-prebsc-1-s2.bnbchain.org:8545"
      reorg_period: 9
    - domain: 11155111
      rpc_urls:
        - "https://ethereum-sepolia-rpc.publicnode.com"
      reorg_period: 2

topology:
  # Enable only when consensus peers use private/RFC1918 advertised addresses.
  use_local_defaults: false

genesis:
  # Optional pre-TEE genesis JSON. Paths are resolved relative to this file.
  # When set, remove the timestamp, epoch length, and DKG window settings below.
  # base: ./custom-genesis.json
  # Omit timestamp for a fresh launch time. Set it to reproduce one exact genesis.
  # timestamp: 1793795928
  epoch_length_blocks: 1200
  dkg_prepare_window_blocks: 300
  dkg_activation_grace_blocks: 300
  prefunded_accounts:
    "0x1111111111111111111111111111111111111111": "1000000000000000000000"
  # Additional keys accepted by outbe-genesis-cli. Network identity, topology,
  # keys, and runtime fields are managed by outbe-up and cannot be overridden.
  overrides: {}
