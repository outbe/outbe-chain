# COEN/USD from the Uniswap V3 WCOEN/USDC pool on Sepolia.
[[currency_pairs]]
base = "COEN"
quote = "840"
markets = [{ provider = "uniswap" }]

# Cross rates: COEN/<ISO> = COEN/840 ÷ <ISO>/840. The markets give dollars per
# unit of the currency. The feeder votes each pair with zero volume.
[[currency_pairs]]
base = "COEN"
quote = "978"   # EUR
cross = "840"
markets = [{ provider = "chainlink_eur_usd" }]

[[currency_pairs]]
base = "COEN"
quote = "392"   # JPY
cross = "840"
markets = [{ provider = "chainlink_jpy_usd" }]

[[currency_pairs]]
base = "COEN"
quote = "826"   # GBP
cross = "840"
markets = [{ provider = "chainlink_gbp_usd" }]

[[currency_pairs]]
base = "COEN"
quote = "156"   # CNY
cross = "840"
markets = [{ provider = "chainlink_cny_usd" }]

[[deviation_thresholds]]
base = "COEN"
threshold = "2.0"

# Gas price of BSC testnet in COEN-wei per unit of gas: eth_feeHistory on
# chain 97 and BNB/USD from Chainlink on the same chain, over rpc_endpoints.97.
[[gas_providers]]
chain_id = 97                                                              # BSC testnet
price_feed = { chainlink = "0x2514895c72f50D8bd4B4F9b1110F0D6bD2c97526" }   # BNB/USD
fee_history_blocks = 20   # 20 × 0.45 s = 9 seconds of gas history
delay_secs = 10           # about 22 blocks behind the start of the vote period

# Gas price of Sepolia: eth_feeHistory on chain 11155111 and ETH/USD from
# Chainlink on Sepolia, over rpc_endpoints.11155111.
[[gas_providers]]
chain_id = 11155111                                                        # Sepolia
price_feed = { chainlink = "0x694AA1769357215DE4FAC081bf1f309aDC325306" }   # ETH/USD
fee_history_blocks = 20   # 20 × 12 s = 4 minutes of gas history
delay_secs = 60           # 5 blocks behind the start of the vote period

# Uniswap V3 WCOEN/USDC 0.30% pool on Sepolia.
[[dex_providers]]
name = "uniswap"
chain_id = 11155111
poll_interval_secs = 10
base_token = "0x3414f55f086Eb224135D9044299E6eBc6E841197"    # WCOEN, CONTRACT_SALT=v7.0.0
quote_token = "0x61dE4c94974089F80790646e9d90094381e99264"   # mock USDC, CONTRACT_SALT=v7.0.0
pool = { protocol = "uniswap_v3", address = "0xb028E7BB0c4138AE454FB28AEBe136b8a11eb445" }   # fee 3000

# Chainlink FX feeds on Ethereum mainnet: real rates, read over rpc_endpoints.1.
[[onchain_providers]]
name = "chainlink_eur_usd"
chain_id = 1
contract = "0xb49f677943BC038e9857d61E7d053CaA2C1734C1"   # EUR / USD

[[onchain_providers]]
name = "chainlink_jpy_usd"
chain_id = 1
contract = "0xBcE206caE7f0ec07b545EddE332A47C2F75bbeb3"   # JPY / USD

[[onchain_providers]]
name = "chainlink_gbp_usd"
chain_id = 1
contract = "0x5c0Ab2d9b5a7ed9f470386e82BB36A3613cDd4b5"   # GBP / USD

[[onchain_providers]]
name = "chainlink_cny_usd"
chain_id = 1
contract = "0xeF8A4aF35cd47424672E3C590aBD37FBB7A7759a"   # CNY / USD

# Policy rate of a currency: the overnight reference rate, annual. The feeder
# reads the rate and its date from `url`. `kind` names the form of the answer.
[[rate_providers]]
currency = "840"   # USD, SOFR, Federal Reserve Bank of New York
kind = "nyfed"
url = "https://markets.newyorkfed.org/api/rates/secured/sofr/last/1.json"

[[rate_providers]]
currency = "978"   # EUR, €STR, European Central Bank
kind = "ecb"
url = "https://data-api.ecb.europa.eu/service/data/EST/B.EU000A2X2A25.WT?lastNObservations=1&format=jsondata"

[[rate_providers]]
currency = "826"   # GBP, SONIA, Bank of England (CSV)
kind = "boe"
url = "https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&SeriesCodes=IUDSOIA&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N"

[[rate_providers]]
currency = "392"   # JPY, TONA, Bank of Japan
kind = "boj"
url = "https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=en&db=FM01&code=STRDCLUCON"

[[rate_providers]]
currency = "344"   # HKD, HIBOR overnight, Hong Kong Monetary Authority
kind = "hkma"
url = "https://api.hkma.gov.hk/public/market-data-and-statistics/daily-monetary-statistics/daily-figures-interbank-liquidity?pagesize=1"

[[rate_providers]]
currency = "156"   # CNY, DR001, China Foreign Exchange Trade System
kind = "cfets"
url = "https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/currency/prr-md.json"
