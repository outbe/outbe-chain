# Testnet feeder pairs and markets. `outbe-genesis-cli` registers these
# pairs in genesis and copies this file to each
# validator's pairs.toml. The cross pairs use the mainnet markets
# (crates/system/oracle/sources). COEN/840 comes from the mock_http price
# server, because COEN has no market on testnet.
#
# Each validator sets in its feeder.toml: the Ethereum RPC under
# `[rpc_endpoints]` and the Pyth key under `[[api_providers]]`.

[[currency_pairs]]
base = "COEN"
quote = "840"
markets = [{ provider = "mock_http" }]

# COEN/978 = COEN/840 ÷ 978/840. The markets give dollars per euro.
[[currency_pairs]]
base = "COEN"
quote = "978"
cross = "840"
markets = [
  { provider = "chainlink_eur_usd" },
  { provider = "pyth" },
]

[[currency_pairs]]
base = "COEN"
quote = "392"
cross = "840"
