# Testnet feeder pairs and markets. `outbe-genesis-cli` registers these
# pairs in genesis and copies this file to each
# validator's pairs.toml. The cross pairs use the mainnet markets
# (crates/system/oracle/sources). COEN/840 comes from the mock_http price
# server, because COEN has no market on testnet.
#
# Each validator sets in its feeder.toml: the Ethereum RPC under
# `[rpc_endpoints]` and the Pyth key under `[[api_providers]]`.

[[currency_pairs]]
base = "COEN"
quote = "840"
markets = [{ provider = "mock_http" }]

# COEN/978 = COEN/840 ÷ 978/840. The markets give dollars per euro.
[[currency_pairs]]
base = "COEN"
quote = "978"
cross = "840"
markets = [
  { provider = "chainlink_eur_usd" },
  { provider = "pyth" },
]

[[currency_pairs]]
base = "COEN"
quote = "392"
cross = "840"
markets = [
  { provider = "chainlink_jpy_usd" },
  { provider = "pyth" },
]

[[currency_pairs]]
base = "COEN"
quote = "826"
cross = "840"
markets = [
  { provider = "chainlink_gbp_usd" },
  { provider = "pyth" },
]

[[currency_pairs]]
base = "COEN"
quote = "156"
cross = "840"
markets = [
  { provider = "chainlink_cny_usd" },
  { provider = "pyth" },
]

[[currency_pairs]]
base = "COEN"
quote = "344"
cross = "840"
markets = [
  { provider = "pyth" },
]

# Policy rate of a currency: the overnight reference rate, annual. The feeder
# reads the rate and its date from `url`. `kind` names the form of the answer.
[[rate_providers]]
currency = "840"   # USD, SOFR, Federal Reserve Bank of New York
kind = "nyfed"
url = "https://markets.newyorkfed.org/api/rates/secured/sofr/last/1.json"

[[rate_providers]]
currency = "978"   # EUR, €STR, European Central Bank
kind = "ecb"
url = "https://data-api.ecb.europa.eu/service/data/EST/B.EU000A2X2A25.WT?lastNObservations=1&format=jsondata"

[[rate_providers]]
currency = "826"   # GBP, SONIA, Bank of England (CSV)
kind = "boe"
url = "https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&SeriesCodes=IUDSOIA&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N"

[[rate_providers]]
currency = "392"   # JPY, TONA, Bank of Japan
kind = "boj"
url = "https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=en&db=FM01&code=STRDCLUCON"

[[rate_providers]]
currency = "344"   # HKD, HIBOR overnight, Hong Kong Monetary Authority
kind = "hkma"
url = "https://api.hkma.gov.hk/public/market-data-and-statistics/daily-monetary-statistics/daily-figures-interbank-liquidity?pagesize=1"

[[rate_providers]]
currency = "156"   # CNY, DR001, China Foreign Exchange Trade System
kind = "cfets"
url = "https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/currency/prr-md.json"

[[deviation_thresholds]]
base = "COEN"
threshold = "2.0"

[[onchain_providers]]
name = "chainlink_eur_usd"
chain_id = 1
contract = "0xb49f677943BC038e9857d61E7d053CaA2C1734C1"   # Chainlink EUR / USD

