# Intentionally no `rustflags = ["--cap-lints", "warn"]`.
#
# A global `--cap-lints warn` caps EVERY lint (including this workspace's own)
# at warn-level, which makes the CI `cargo clippy --all-targets --all-features
# -- -D warnings` gate a false-green: it can never fail, so lint regressions
# land silently. Cargo already caps external dependencies at `allow`
# automatically, so a global cap-lints is unnecessary for deps and only neuters
# our own lint gate. Keep this file free of a workspace-wide lint cap.

[alias]
xtask = "run --locked --package xtask --"

# Developer-only source override: consume the sibling `outbe-circuits`
# checkout (which contains the frozen `outbe.emit.mint@1.0.0` circuit,
# committed revision `c0c1c9e`) instead of the published `v0.11.0` tag, which
# predates Emit. All four circuit packages are patched together so exactly one
# `outbe-protocol` type identity is shared across `outbe-zk-canonical`,
# `outbe-zk-backend`, the TEE enclave, and the E2E harness. Publishing/tagging
# the circuit and removing this override is a separate release operation; the
# canonical Git declarations in the root `Cargo.toml` stay unchanged.
[patch."https://github.com/outbe/outbe-circuits.git"]
outbe-zk-canonical = { path = "../outbe-circuits/crates/outbe-zk-canonical" }
outbe-zk-backend = { path = "../outbe-circuits/crates/outbe-zk-backend" }
outbe-protocol = { path = "../outbe-circuits/crates/outbe-protocol" }
outbe-protocol-derive = { path = "../outbe-circuits/crates/outbe-protocol-derive" }
