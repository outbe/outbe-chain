[package]
name = "outbe-e2e-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ocomp-finality-fixture = [
    "dep:alloy-consensus",
    "dep:alloy-rlp",
    "dep:alloy-trie",
    "dep:commonware-consensus",
    "dep:k256",
    "dep:outbe-common",
    "dep:outbe-fidelity",
    "dep:outbe-metadosis",
    "dep:outbe-node",
    "dep:outbe-ocomp-protocol",
    "dep:outbe-ocompregistry",
    "dep:outbe-oracle",
    "dep:reth-chainspec",
    "dep:reth-primitives-traits",
    "dep:reth-storage-api",
    "dep:reth-trie",
    "dep:revm",
]
ocomp-integration = [
    "ocomp-finality-fixture",
    "dep:k256",
    "outbe-metadosis/test-utils",
    "dep:outbe-nod",
    "dep:outbe-nodfactory",
    "dep:outbe-offchain-data",
    "dep:outbe-offchain-storage",
    "dep:outbe-paynote",
    "dep:outbe-tribute",
    "dep:outbe-tee-enclave",
    "dep:reth-ethereum",
    "dep:reth-provider",
]
release-sgx-e2e = []

# e2e harness. The scenarios are Gherkin fixtures under `features/`; the step
# code behind them drives the `world/` handles. Chain reads/sends are native
# (alloy provider + `sol!`); the committee validators, joiner, followers, and
# their enclave containers are Rust-owned processes (no `run-testnet.sh`/`nohup`).
# Bootstrap keeps two one-shot subprocesses (`outbe-chain dkg bootstrap` +
# `python3 seed_genesis.py`); governance/tribute sends go through `outbe-cli` (the
# product CLI under test). It is the canonical owner of localnet e2e orchestration.

[dependencies]
# The World type and step definitions live in `src/` (so `run()` can register
# them), so cucumber is a normal dependency, not dev-only.
cucumber = "0.21"
xshell = "0.2"
clap.workspace = true
futures.workspace = true
tokio.workspace = true
eyre.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
walkdir.workspace = true
tempfile.workspace = true
mongodb.workspace = true
hex.workspace = true
multibase.workspace = true
libc.workspace = true
outbe-compressed-entities.workspace = true
outbe-chain-constants.workspace = true
outbe-evm.workspace = true
outbe-primitives.workspace = true
outbe-protocol.workspace = true
outbe-protocol-derive.workspace = true
outbe-tee.workspace = true
outbe-zk-backend.workspace = true
outbe-zk-canonical.workspace = true
outbe-common = { workspace = true, optional = true }
outbe-consensus.workspace = true
outbe-fidelity = { workspace = true, optional = true }
outbe-metadosis = { workspace = true, optional = true }
outbe-nod = { workspace = true, optional = true }
outbe-nodfactory = { workspace = true, optional = true }
# Note construction and proving for the Nod cost-discharge scenario.
outbe-paynote = { workspace = true, features = ["test-utils"], optional = true }
outbe-node = { workspace = true, optional = true }
outbe-ocomp-protocol = { workspace = true, optional = true }
outbe-ocompregistry = { workspace = true, optional = true }
outbe-offchain-data = { workspace = true, optional = true }
outbe-offchain-storage = { workspace = true, optional = true }
outbe-oracle = { workspace = true, optional = true }
outbe-tribute = { workspace = true, optional = true }
outbe-tee-enclave = { workspace = true, optional = true }
rand.workspace = true
reth-chainspec = { workspace = true, optional = true }
reth-ethereum = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true, optional = true }
reth-provider = { workspace = true, features = ["test-utils"], optional = true }
reth-storage-api = { workspace = true, optional = true }
reth-trie = { workspace = true, optional = true }
revm = { workspace = true, optional = true }
# Genesis `genesisTime` ISO-8601 formatting (bootstrap glue ported from `date -u`).
time = { workspace = true, features = ["formatting", "parsing"] }

# Native JSON-RPC (reads + local-signer sends), replacing the `cast` shell-outs.
# Mirrors the canonical provider client in `bin/outbe-feeder`.
alloy-primitives = { workspace = true, features = ["std"] }
alloy-eips.workspace = true
alloy-consensus = { workspace = true, optional = true }
alloy-rlp = { workspace = true, optional = true }
alloy-trie = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-provider.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
alloy-network.workspace = true
alloy-rpc-types.workspace = true
ark-bn254.workspace = true
ark-ff.workspace = true

# BLS MinSig keygen/signing for the L2Registry zk-gate scenarios (PFS-001-10/-11):
# the harness plays the L2 network signing `zkMerkleRoot` with a registered key.
bytes.workspace = true
commonware-codec.workspace = true
commonware-consensus = { workspace = true, optional = true }
commonware-cryptography.workspace = true
commonware-utils.workspace = true
blst.workspace = true
k256 = { workspace = true, optional = true }
rand_core.workspace = true
rustix.workspace = true

# The e2e runner is a binary: the CLI defines the environment (validators, TEE
# mode, sudo); Gherkin tags define each scenario's requirements.
[[bin]]
name = "outbe-e2e"
path = "src/main.rs"

[[bin]]
name = "outbe-release-sgx-e2e"
path = "src/bin/outbe-release-sgx-e2e.rs"
required-features = ["release-sgx-e2e"]

[[bin]]
name = "outbe-release-dcap-evidence"
path = "src/bin/outbe-release-dcap-evidence.rs"

[[bin]]
name = "outbe-e2e-evidence"
path = "src/bin/outbe-e2e-evidence.rs"

[[bin]]
name = "outbe-verification-ledger"
path = "src/bin/outbe-verification-ledger.rs"

[[bin]]
name = "outbe-metadosis-evidence"
path = "src/bin/outbe-metadosis-evidence.rs"
required-features = ["ocomp-integration"]

[[test]]
name = "ocomp_checkpoint_handoff"
path = "tests/ocomp_checkpoint_handoff.rs"
required-features = ["ocomp-integration"]

[dev-dependencies]
trybuild = "1"

[[test]]
name = "ocomp_harness_contract"
path = "tests/ocomp_harness_contract.rs"

[lints]
workspace = true
