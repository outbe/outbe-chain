[package]
name = "outbe-p-link-measurements"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-ec = "=0.5.0"
ark-r1cs-std = "=0.5.0"
ark-relations = "=0.5.1"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
ark-std = "=0.5.0"
p384 = { version = "=0.13.1", default-features = false, features = ["arithmetic", "hash2curve", "std"] }
sha2 = "=0.10.9"
rand = "0.8"
rand_chacha = "0.3"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
outbe-protocol = { git = "https://github.com/outbe/outbe-circuits.git", tag = "v0.14.0", features = ["alloy"] }
outbe-protocol-derive = { git = "https://github.com/outbe/outbe-circuits.git", tag = "v0.14.0" }
ark-bn254-v6 = { package = "ark-bn254", version = "=0.6.0" }
ark-ff-v6 = { package = "ark-ff", version = "=0.6.0" }
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["std"] }
