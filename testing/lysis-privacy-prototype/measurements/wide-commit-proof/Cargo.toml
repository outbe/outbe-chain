[package]
name = "outbe-wide-commit-proof"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ark-bw6-761 = { version = "=0.5.0", features = ["std"] }
ark-ed-on-bw6-761 = { version = "=0.5.0", features = ["std", "r1cs"] }
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-r1cs-std = "=0.5.0"
ark-relations = "=0.5.1"
ark-serialize = "=0.5.0"
ark-std = "=0.5.0"
ark-crypto-primitives = { version = "=0.5.0", features = ["crh", "r1cs"] }
num-bigint = "0.4"
rand = "0.8"
sha2 = "=0.10.9"
serde_json = "1"
hex = "0.4"

