[package]
name = "outbe-private-flow-measurements"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bulletproofs = { version = "=5.0.0", features = ["yoloproofs"] }
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "digest"] }
merlin = "=3.0.0"
rand = "0.8"
rand_chacha = "0.3"
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1"
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["std"] }

[patch.crates-io]
bulletproofs = { path = "vendor/bulletproofs" }
