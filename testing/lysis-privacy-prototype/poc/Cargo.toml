[package]
name = "outbe-private-lifecycle-poc"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["std"] }
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ed-on-bn254 = { version = "=0.5.0", features = ["r1cs"] }
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-r1cs-std = "=0.5.0"
ark-relations = "=0.5.1"
ark-serialize = "=0.5.0"
ark-std = "=0.5.0"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
hex = "=0.4.3"
num-bigint = "0.4"
num-traits = "0.2"
outbe-p-link-measurements = { path = "../measurements/p-link" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }

[profile.release]
debug = false
