[package]
name = "outbe-twisted-poc"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
outbe-private-lifecycle-poc = { path = ".." }
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ed-on-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
bulletproofs = "=5.0.0"
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "digest", "serde"] }
merlin = "=3.0.0"
rand = "=0.8.5"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "=1.3.3"
sha2 = "=0.10.9"
hex = "=0.4.3"

[profile.release]
debug = false
