[package]
name = "outbe-ristretto-lifecycle-poc"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-r1cs-std = "=0.5.0"
ark-relations = "=0.5.1"
ark-serialize = "=0.5.0"
ark-std = "=0.5.0"
bulletproofs = "=5.0.0"
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "digest", "serde"] }
merlin = "=3.0.0"
rand = "=0.8.5"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "=1.3.3"
sha2 = "=0.10.9"
hex = "=0.4.3"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
outbe-p-link-measurements = { path = "../../../measurements/p-link" }

[profile.release]
debug = false
