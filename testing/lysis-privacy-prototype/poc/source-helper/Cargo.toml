[package]
name = "outbe-poc-l2-source"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
outbe-protocol = { git = "https://github.com/outbe/outbe-circuits.git", tag = "v0.14.0", features = ["alloy"] }
outbe-protocol-derive = { git = "https://github.com/outbe/outbe-circuits.git", tag = "v0.14.0" }
outbe-zk-canonical = { git = "https://github.com/outbe/outbe-circuits.git", tag = "v0.14.0" }
outbe-zk-backend = { git = "https://github.com/outbe/outbe-circuits.git", tag = "v0.14.0", default-features = false }
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
ark-std = "=0.6.0"
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["std"] }
num-bigint = "0.4"
serde_json = "1"
hex = "0.4"
rand = "0.8"
