[workspace]
members = [
    "xtask",
    # blockchain
    "crates/blockchain/macros",
    "crates/blockchain/constants",
    "crates/blockchain/primitives",
    "crates/blockchain/evm",
    "crates/blockchain/consensus",
    "crates/blockchain/engine",
    "crates/blockchain/rpc",
    "crates/blockchain/txpool",
    "crates/blockchain/node",
    "crates/blockchain/operator",
    "crates/blockchain/radicle",
    "crates/blockchain/snapshot",
    # system
    "crates/system/validatorset",
    "crates/system/slashindicator",
    "crates/system/staking",
    "crates/system/rewards",
    "crates/system/oracle",
    "crates/system/zerofee",
    "crates/system/emissionlimit",
    "crates/system/cycle",
    "crates/system/tee",
    "crates/system/teeregistry",
    "crates/system/l2registry",
    "crates/system/coderegistry",
    "crates/system/radicle",
    "crates/system/update",
    "crates/system/vote",
    "crates/system/hyperlanecontroller",
    # core outbe
    "crates/core/gratis",
    "crates/core/promis",
    "crates/core/promisfactory",
    "crates/core/tribute",
    "crates/core/nod",
    "crates/core/nodfactory",
    "crates/core/gem",
    "crates/core/gemfactory",
    "crates/core/intex",
    "crates/core/intexfactory",
    "crates/core/desis",
    "crates/core/vaultrouter",
    "crates/core/lysis",
    "crates/core/agentreward",
    "crates/core/ccaregistry",
    "crates/core/credis",
    "crates/core/credisfactory",
    "crates/core/fidelity",
    "crates/core/fidelity-math",
    "crates/core/metadosis",
    "crates/core/promislimit",
    "crates/core/tributefactory",
    "crates/core/gratisfactory",
    "crates/core/governance",
    "crates/core/stablecoinpolicy",
    "crates/core/stablecoin",
    "crates/core/stablecoinfactory",
    "crates/core/common",
    # binaries
    "bin/outbe-chain",
    "bin/outbe-genesis-cli",
    "bin/outbe-keygen",
    "bin/outbe-cli",
    "bin/outbe-feeder",
    "bin/outbe-hyperlane-attester",
    "bin/outbe-radicle",
    "bin/outbe-tee-enclave",
    # testing
    "testing/e2e-harness",
    "testing/lysis-v1-reference",
    "testing/protocol-benchmarks",
    "crates/zk/poseidon",
    "crates/zk/outbe-zk",
    "crates/zk/outbe-zk-backend",
]
exclude = [
    "vendor/alloy-evm",
    "vendor/heartwood",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Workspace-wide lint levels. Members opt in with `[lints]\nworkspace = true`.
# `unsafe_code = "deny"` makes every `unsafe` a hard error unless the site
# carries an explicit, documented `#[allow(unsafe_code)]` (the one audited
# exception lives in crates/blockchain/evm/src/precompiles.rs). `warnings =
# "deny"` promotes every remaining rustc warning to an error - the "deny + fix"
# posture, matching CI's `clippy -D warnings`.
[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
# Any retained `unsafe` block must justify itself with a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"

