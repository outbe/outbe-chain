# Commonware (v2026.9.0)
commonware-actor = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-broadcast = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-consensus = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-cryptography = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-p2p = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-runtime = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-storage = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-codec = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-utils = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-math = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-parallel = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
commonware-macros = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }

# BLS
blst = { version = "0.3.13", default-features = false }

# Crypto
argon2 = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }
keyring = { version = "3", features = ["apple-native", "linux-native"] }
ring = "0.17"
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
num-bigint = "0.4"
num-traits = "0.2"

# ZK / Poseidon
outbe-poseidon = { path = "crates/zk/poseidon" }
outbe-zk = { path = "crates/zk/outbe-zk", features = ["alloy"] }
outbe-zk-backend = { path = "crates/zk/outbe-zk-backend" }
ark-bn254 = "0.6"
ark-ff = { version = "0.6", features = ["std"] }

# Serialization
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = { package = "yaml_serde", version = "=0.10.4" }
idna = "1.1"
multibase = "0.9"
# Compact binary serde format for the node<->enclave wire (postcard): the offer
# ciphertext rides as length-prefixed raw bytes (1x) instead of a JSON number
# array (~4x), and alloy U256/Address/B256 serialize as bytes, not hex strings.
postcard = { version = "1", default-features = false, features = ["use-std"] }

# CLI / IO
clap = { version = "4", features = ["derive"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
reqwest = { version = "0.12", features = ["json"] }

# Runtime
rand = "0.8"
rand-commonware = { package = "rand", version = "0.10.2", features = ["chacha"] }
rand-core-commonware = { package = "rand_core", version = "0.10.1" }
rand_core = { version = "0.6", features = ["getrandom"] }
bytes = "1"
metrics = "0.24"

# TEE node <-> enclave transport (Noise-IK over UDS)
snow = "0.9"

# Config
toml = "0.8"

# Testing
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Proc-macro
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

# Text diff (governance proposal vs canon/meta-canon; view-only, deterministic)
similar = "2"

# Utilities
thiserror = "2"
eyre = "0.6"
hex = "0.4"
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
tracing = "0.1"
futures = "0.3"
time = "0.3"
filetime = "0.2"
flate2 = "1"
sha2 = "0.10"
walkdir = "2"
tar = "0.4"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = 0

[profile.dev.package.outbe-zk-backend]
opt-level = 3
[patch.crates-io]
alloy-evm = { path = "vendor/alloy-evm" }
outbe-poseidon = { path = "crates/zk/poseidon" }
