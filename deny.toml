[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# All entries are transitive deps pulled in by upstream crates and cannot be
# upgraded away without upstream changes. Unmaintained advisories are
# informational.
# Revisit when upstreams bump the affected dependencies.
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained
    # rsa Marvin timing sidechannel: no patched release exists upstream. Pulled
    # via ssh-key -> radicle-crypto (Heartwood keystore); Outbe identities are
    # Ed25519, the rsa code path is never exercised for key material.
    "RUSTSEC-2023-0071",
    # The legacy elliptic-curve line requires crypto-bigint 0.5; the timing
    # fixes are only available in 0.7.6+. Revisit by 2027-01-24 or when the
    # upstream stack migrates. Timing leakage remains a risk for secret
    # arithmetic on this legacy path. cargo-deny 0.19 does not support scoping
    # advisory exceptions by dependency edge or enforcing an expiry.
    { id = "RUSTSEC-2026-0387", reason = "elliptic-curve 0.13.8 requires crypto-bigint 0.5.5, which has no compatible patched release; the 0.7 dependency is patched separately" },
    # zstd 0.13.3 / zstd-safe 7.2.4 / zstd-sys 2.0.16 are transitive dependencies of
    # reth v2.8.1 and commonware-storage v2026.9.0; patched releases (zstd >= 0.14.3,
    # zstd-safe >= 8.2.0, zstd-sys >= 2.1.2) are semver-breaking major/exact-pin bumps
    # that require upstream reth and commonware upgrades.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 is required by reth v2.8.1 and commonware-storage v2026.9.0; patched release >=0.14.3 is semver-incompatible" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.2.4 is required by zstd 0.13.3 and compression-codecs 0.4.37 (via reth); patched release >=8.2.0 is semver-incompatible and seekable feature is unused" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.2.4 is required by zstd 0.13.3 and compression-codecs 0.4.37 (via reth); patched release >=8.2.0 is semver-incompatible" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys =2.0.16 is pinned by zstd-safe 7.2.4; advisory affects only wasm32 allocator shim while Outbe targets x86_64-unknown-linux-gnu" },
]

[licenses]
# Permissive / file-level-copyleft licenses present in the reth dep tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BlueOak-1.0.0",
    "BSL-1.0",
]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal crates are declared as path deps without a version, which
# cargo-deny otherwise flags as wildcards.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
