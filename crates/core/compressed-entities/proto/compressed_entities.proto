syntax = "proto3";

package outbe.compressed_entities.v1;

message StoredBody {
  uint32 schema_version = 1;
  bytes payload = 2;
}

message TributeBody {
  bytes tribute_id = 1;
  bytes owner = 2;
  uint32 worldwide_day = 3;
  bytes issuance_amount_minor = 4;
  uint32 issuance_currency = 5;
  bytes nominal_amount_minor = 6;
  uint32 reference_currency = 7;
  bytes tribute_price_minor = 8;
}

message NodItemBody {
  bytes nod_id = 1;
  bytes owner = 2;
  bytes gratis_load_minor = 3;
  uint32 worldwide_day = 4;
  uint32 league_id = 5;
  bytes bucket_key = 6;
  uint32 issuance_currency = 7;
  uint32 reference_currency = 8;
  uint64 issued_at = 9;
  bool is_settled = 10;
}

message NodBucketBody {
  bytes bucket_key = 1;
  uint32 worldwide_day = 2;
  bytes entry_price_minor = 3;
  uint32 reference_currency = 4;
  uint64 settled_nods = 5;
}

message GemBody {
  bytes gem_id = 1;
  bytes owner = 2;
  uint32 gem_type = 3;
  bytes promis_load_minor = 4;
  uint32 issuance_currency = 5;
  uint32 reference_currency = 6;
  uint64 issued_at = 7;
  bytes bucket_key = 8;
  uint32 state = 9;
  uint64 called_at = 10;
  uint64 settled_at = 11;
}

message GemBucketBody {
  bytes bucket_key = 1;
  uint32 worldwide_day = 2;
  bytes entry_price_minor = 3;
  uint32 reference_currency = 4;
  uint64 settled_gems = 5;
}
