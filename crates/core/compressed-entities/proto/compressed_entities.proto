syntax = "proto3";

package outbe.compressed_entities.v1;

message StoredBody {
  uint32 schema_version = 1;
  bytes payload = 2;
}

message TributeBody {
  bytes tribute_id = 1;
  bytes owner = 2;
  uint32 worldwide_day = 3;
  bytes issuance_amount_minor = 4;
  uint32 issuance_currency = 5;
  bytes nominal_amount_minor = 6;
  uint32 reference_currency = 7;
  bytes tribute_price_minor = 8;
  reserved 9;
  reserved "exclude_from_intex_issuance";
}

message NodItemBody {
  bytes nod_id = 1;
  bytes owner = 2;
  bytes gratis_load_minor = 3;
  uint32 worldwide_day = 4;
  uint32 league_id = 5;
  reserved 6;
  reserved "floor_price_minor";
  bytes bucket_key = 7;
  reserved 8;
  reserved "settlement_cost_minor";
  uint32 issuance_currency = 9;
  uint32 reference_currency = 10;
  uint64 issued_at = 11;
  bool is_settled = 12;
}

message NodBucketBody {
  bytes bucket_key = 1;
  uint32 worldwide_day = 2;
  reserved 3, 4, 5;
  reserved "floor_price_minor", "is_qualified", "total_nods";
  bytes entry_price_minor = 6;
  uint32 reference_currency = 7;
  uint64 settled_nods = 8;
}

message GemBody {
  bytes gem_id = 1;
  bytes owner = 2;
  uint32 gem_type = 3;
  bytes promis_load_minor = 4;
  reserved 5;
  reserved "floor_price_minor";
  uint32 issuance_currency = 6;
  uint32 reference_currency = 7;
  uint64 issued_at = 8;
  bytes bucket_key = 9;
  uint32 state = 10;
  uint64 called_at = 11;
  uint64 settled_at = 12;
}

message GemBucketBody {
  bytes bucket_key = 1;
  uint32 worldwide_day = 2;
  bytes entry_price_minor = 3;
  uint32 reference_currency = 4;
  uint64 settled_gems = 5;
}
