[package]
name = "outbe-tribute"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-core-common.workspace = true
outbe-emission.workspace = true
outbe-enclave.workspace = true
outbe-fidelity.workspace = true
outbe-lysis.workspace = true
outbe-macros.workspace = true
outbe-nod.workspace = true
outbe-nodfactory.workspace = true
outbe-primitives.workspace = true
outbe-tee.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true

[dev-dependencies]
outbe-oracle.workspace = true
outbe-system-common.workspace = true
alloy-consensus.workspace = true
outbe-nodfactory = { workspace = true, features = ["test-utils"] }
outbe-promislimit.workspace = true
outbe-tribute = { path = ".", features = ["test-enclave", "test-utils"] }
alloy-primitives = { workspace = true, features = ["rand"] }
proptest.workspace = true
revm.workspace = true
tempfile.workspace = true

[features]
default = []
bench-utils = []
# Enabled by the node binary in release builds. Asserts, at compile time, that
# the attestation-skipping in-process stand-in is not in this build.
production-enclave = []
test-enclave = ["outbe-enclave/engine", "outbe-nod/test-enclave"]
test-utils = ["outbe-primitives/test-utils"]

[lints]
workspace = true
