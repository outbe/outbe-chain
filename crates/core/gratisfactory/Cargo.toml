[package]
name = "outbe-gratisfactory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-system-common.workspace = true
outbe-core-common.workspace = true
outbe-macros.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
outbe-gratis.workspace = true
outbe-fidelity.workspace = true
outbe-vaultrouter.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Drive the confidential Gratis path in tests via the in-process enclave engine.
outbe-gratis = { workspace = true, features = ["test-enclave"] }
outbe-fidelity = { workspace = true, features = ["test-enclave"] }
outbe-enclave = { workspace = true, features = ["engine"] }

[features]
default = []
test-utils = ["outbe-gratis/test-utils"]

[lints]
workspace = true
