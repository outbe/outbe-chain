[package]
name = "outbe-nod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-common.workspace = true
outbe-tee.workspace = true
outbe-macros.workspace = true
outbe-primitives.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
serde.workspace = true
thiserror.workspace = true

outbe-tee-enclave = { workspace = true, optional = true }

[dev-dependencies]
outbe-nod = { path = ".", features = ["test-enclave"] }
outbe-tee-enclave.workspace = true
alloy-primitives = { workspace = true, features = ["rand"] }
base64.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
default = []
test-utils = ["outbe-primitives/test-utils"]
test-enclave = ["dep:outbe-tee-enclave"]
# Shortens the DEV call notice to a real e2e wait. Never enabled in a release build.
e2e-test = []

[lints]
workspace = true
