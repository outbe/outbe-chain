[package]
name = "outbe-nod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-system-common.workspace = true
outbe-core-common.workspace = true
outbe-enclave.workspace = true
outbe-tee.workspace = true
outbe-macros.workspace = true
outbe-primitives.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
outbe-nod = { path = ".", features = ["test-enclave"] }
alloy-primitives = { workspace = true, features = ["rand"] }
base64.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
default = []
test-utils = ["outbe-primitives/test-utils"]
# Enabled by the node binary in release builds. Asserts, at compile time, that
# the attestation-skipping in-process stand-in is not in this build.
production-enclave = []
test-enclave = ["outbe-enclave/engine"]
# Shortens the DEV call notice to a real e2e wait. Never enabled in a release build.
e2e-test = []

[lints]
workspace = true
