[package]
name = "outbe-credisfactory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-macros.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
outbe-credis.workspace = true
outbe-gratis.workspace = true
# The pledge quote's age lives beside the ticket in gratisfactory storage; the
# TTL that judges it is a Credis parameter, so the check happens here.
outbe-gratisfactory.workspace = true
outbe-fidelity.workspace = true
outbe-promislimit.workspace = true
outbe-vaultrouter.workspace = true
outbe-oracle.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Drive the confidential Gratis + Fidelity paths in the e2e tests via the
# in-process enclave engines; `test-enclave` is unioned into each dep for tests.
outbe-gratis = { workspace = true, features = ["test-enclave"] }
outbe-fidelity = { workspace = true, features = ["test-enclave"] }
outbe-tee.workspace = true
outbe-tee-enclave.workspace = true

[lints]
workspace = true
