[package]
name = "outbe-credisfactory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-primitives = { workspace = true, features = ["test-utils"] }
outbe-ccaregistry.workspace = true
outbe-credis.workspace = true
outbe-gratisfactory.workspace = true
outbe-fidelity.workspace = true
outbe-promislimit.workspace = true
outbe-vaultrouter.workspace = true
outbe-oracle.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
outbe-primitives = { workspace = true, features = ["bench-utils"] }
# Drive the confidential Gratis + Fidelity paths in the e2e tests via the
# in-process enclave engines; `test-enclave` is unioned into each dep for tests.
outbe-gratis = { workspace = true, features = ["test-enclave"] }
outbe-fidelity = { workspace = true, features = ["test-enclave"] }
outbe-tee.workspace = true
outbe-tee-enclave.workspace = true
outbe-common.workspace = true
base64.workspace = true
serde_json.workspace = true
outbe-evm = { workspace = true, features = ["test-utils"] }
outbe-vaultrouter = { workspace = true, features = ["test-utils"] }
outbe-oracle = { workspace = true, features = ["test-utils"] }
outbe-ccaregistry.workspace = true
outbe-credis.workspace = true
outbe-gratisfactory.workspace = true
eyre.workspace = true
revm.workspace = true
alloy-primitives.workspace = true

[lints]
workspace = true

[features]
# Short notice period and the test hooks, so an e2e run can watch a Credis lapse.
e2e-test = ["outbe-credis/e2e-test"]
