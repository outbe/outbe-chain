[package]
name = "outbe-fidelity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-enclave.workspace = true
outbe-macros.workspace = true
outbe-primitives.workspace = true
outbe-system-common.workspace = true
outbe-tee.workspace = true
outbe-fidelity-math.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
outbe-primitives = { workspace = true, features = ["test-utils"] }
serde_json.workspace = true
# Fidelity's own tests run the confidential path against the in-process engine.
outbe-enclave = { workspace = true, features = ["engine", "dev-keys"] }
# Sign EIP-191 owner authorizations for the query-path tests.
k256.workspace = true
# Sign enclave attestation tags for the response-validation tests.
ed25519-dalek.workspace = true

[features]
default = []
test-utils = ["outbe-primitives/test-utils"]
# Enabled by the node binary in release builds. Asserts, at compile time, that
# the attestation-skipping in-process stand-in is not in this build.
production-enclave = []
# Exposes the in-process enclave stand-in so other crates' tests can drive the
# confidential Fidelity path (mirrors gratis' `test-enclave`).
test-enclave = ["outbe-enclave/engine", "outbe-enclave/dev-keys"]

[lints]
workspace = true
