[package]
name = "outbe-gem"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-common.workspace = true
outbe-macros.workspace = true
outbe-primitives.workspace = true
outbe-oracle = { path = "../../system/oracle" }
outbe-promislimit.workspace = true
tracing.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true
hex.workspace = true

[dev-dependencies]
outbe-primitives = { workspace = true, features = ["test-utils"] }
alloy-primitives = { workspace = true, features = ["rand"] }
base64.workspace = true
serde_json.workspace = true

[features]
default = []
test-utils = ["outbe-primitives/test-utils"]
# Shorten the DEV profile's wall-clock waits so an e2e run can sit them out.
# Never enabled in a release build.
e2e-test = []

[lints]
workspace = true
