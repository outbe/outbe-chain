[package]
name = "outbe-agentreward"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-macros.workspace = true
outbe-common.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
# The CCA pool is weighted by origination units and the performance multiplier,
# both owned by the registry. `outbe-cca` depends only on macros/primitives/common,
# so this stays acyclic.
outbe-cca.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
tracing.workspace = true

[package.metadata.cargo-machete]
ignored = ["alloy-sol-types"]

[lints]
workspace = true
