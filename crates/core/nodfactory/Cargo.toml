[package]
name = "outbe-nodfactory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-common.workspace = true
outbe-primitives.workspace = true
outbe-nod.workspace = true
outbe-promislimit.workspace = true
outbe-vaultrouter.workspace = true
outbe-oracle.workspace = true
outbe-gratisfactory.workspace = true
outbe-tee.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true
hex.workspace = true
tracing.workspace = true

outbe-tee-enclave = { workspace = true, optional = true }

[dev-dependencies]
outbe-tee = { workspace = true, features = ["test-utils"] }
outbe-nod = { workspace = true, features = ["test-utils", "test-enclave"] }
base64.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
# `test-enclave` drives the confidential Gratis path in `mine_gratis` tests via
# the in-process enclave engine; unioned into the gratis dep for test builds.
outbe-gratis = { workspace = true, features = ["test-enclave"] }
outbe-tee-enclave.workspace = true
alloy-primitives = { workspace = true, features = ["rand"] }
revm.workspace = true
outbe-evm = { workspace = true, features = ["test-utils"] }
outbe-vaultrouter = { workspace = true, features = ["test-utils"] }
outbe-oracle = { workspace = true, features = ["test-utils"] }

[features]
default = []
test-utils = ["outbe-primitives/test-utils", "outbe-nod/test-enclave", "outbe-tee/test-utils", "dep:outbe-tee-enclave"]
# Test-only issuance and call-notice hooks for e2e runs. Never enabled in a release build.
e2e-test = ["outbe-nod/e2e-test", "outbe-tee/e2e-test"]

[package.metadata.cargo-machete]
ignored = ["hex"]

[lints]
workspace = true
