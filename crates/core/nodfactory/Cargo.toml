[package]
name = "outbe-nodfactory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-system-common.workspace = true
outbe-core-common.workspace = true
outbe-primitives.workspace = true
outbe-nod.workspace = true
outbe-promislimit.workspace = true
outbe-vaultrouter.workspace = true
outbe-oracle.workspace = true
outbe-gratisfactory.workspace = true
outbe-tee.workspace = true
outbe-agentreward.workspace = true
outbe-l2registry.workspace = true
outbe-worldwideday.workspace = true
outbe-zk.workspace = true
outbe-zk-backend.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true
hex.workspace = true
tracing.workspace = true


[dev-dependencies]
outbe-tee = { workspace = true, features = ["test-utils"] }
outbe-nod = { workspace = true, features = ["test-utils", "test-enclave"] }
base64.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
# `test-enclave` drives the confidential Gratis path in `mine_gratis` tests via
# the in-process enclave engine; unioned into the gratis dep for test builds.
outbe-gratis = { workspace = true, features = ["test-enclave"] }
alloy-primitives = { workspace = true, features = ["rand"] }
outbe-vaultrouter = { workspace = true, features = ["test-utils"] }
outbe-oracle = { workspace = true, features = ["test-utils"] }
commonware-codec.workspace = true
commonware-cryptography.workspace = true
rand-commonware.workspace = true
x25519-dalek.workspace = true
serde_json.workspace = true

[features]
default = []
test-utils = ["outbe-primitives/test-utils", "outbe-nod/test-enclave", "outbe-tee/test-utils"]

[package.metadata.cargo-machete]
ignored = ["hex"]

[lints]
workspace = true
