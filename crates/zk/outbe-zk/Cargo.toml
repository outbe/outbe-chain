[package]
name = "outbe-zk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tribute circuit statements, claim hashing, and verifier wire decoding."

[features]
alloy = ["dep:alloy-primitives"]

[build-dependencies]
serde_json.workspace = true
base64.workspace = true
toml.workspace = true
toml_edit = "0.22"
tiny-keccak = { version = "2", features = ["keccak"] }

[dependencies]
ark-bn254 = { workspace = true, features = ["curve", "asm"] }
ark-ff = { workspace = true, features = ["asm", "parallel"] }
ark-ec = { version = "0.6", default-features = false, features = ["parallel"] }
ark-grumpkin = { version = "0.6", default-features = false, features = ["asm"] }
ark-serialize = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false, features = ["parallel"] }
alloy-primitives = { workspace = true, optional = true }
blake2 = { version = "0.10", default-features = false }
hex-literal = "0.4"
outbe-poseidon.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
alloy-primitives.workspace = true
ark-std = { version = "0.6", features = ["parallel"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["hex-literal"]
