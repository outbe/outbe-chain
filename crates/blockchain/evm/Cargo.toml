[package]
name = "outbe-evm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Internal
outbe-primitives.workspace = true
outbe-tee.workspace = true
outbe-consensus.workspace = true

# Alloy
alloy-rpc-types-eth.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-evm.workspace = true

# Signing
hex.workspace = true

# Revm
revm = { workspace = true, features = ["memory_limit"] }

# Reth
reth-ethereum = { workspace = true, features = [
    "evm",
    "node",
    "node-api",
    "cli",
] }
reth-evm.workspace = true
reth-provider.workspace = true
reth-primitives-traits.workspace = true
reth-rpc-eth-api.workspace = true

alloy-sol-types.workspace = true
blst.workspace = true
eyre.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
postcard.workspace = true

[dev-dependencies]
outbe-genesis-cli.workspace = true
outbe-consensus = { workspace = true, features = ["test-utils"] }
outbe-tee = { workspace = true, features = ["test-utils"] }
outbe-chain-constants.workspace = true
outbe-node.workspace = true
alloy-sol-types.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
reth-chainspec.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
reth-trie = { workspace = true, features = ["test-utils"] }
k256.workspace = true
ed25519-dalek.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
# proposer/validator determinism test: build a real BLS late-finalize
# credit + committee snapshot to exercise verify+record on both paths.
commonware-cryptography.workspace = true
commonware-consensus.workspace = true
commonware-codec.workspace = true
commonware-utils.workspace = true
commonware-math.workspace = true
rand-commonware.workspace = true
rand-core-commonware.workspace = true

[features]
test-utils = []
# Names stay. The compile-time test-enclave forward is empty until the
# runtime composition root owns these features.
production-enclave = []
e2e-test = []
# Exposes execution test controls to crates/runtime integration tests.
# It does not pull a domain crate.
test-hooks = []

[package.metadata.cargo-machete]
ignored = ["hex"]

[lints]
workspace = true
