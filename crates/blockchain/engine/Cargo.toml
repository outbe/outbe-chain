[package]
name = "outbe-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Concrete CL/EL adapters and execution-backed integration fixtures.

[features]
default = []
# Exports hidden snapshot test support (`DiskFixture` and native snapshot helpers).
snapshot-integration = ["dep:tempfile"]

[dependencies]
# Internal
outbe-consensus.workspace = true
outbe-execution.workspace = true
outbe-primitives.workspace = true

# Commonware
commonware-actor.workspace = true
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-macros.workspace = true
commonware-p2p.workspace = true
commonware-runtime.workspace = true
commonware-storage.workspace = true
commonware-codec.workspace = true
commonware-utils.workspace = true
commonware-math.workspace = true
commonware-parallel.workspace = true

# Reth
reth-ethereum = { workspace = true, features = ["node", "node-api", "storage-api", "network"] }
reth-node-builder.workspace = true
reth-payload-builder.workspace = true
reth-provider.workspace = true
reth-chain-state.workspace = true
reth-storage-api.workspace = true
reth-stages-types.workspace = true

# Alloy
alloy-primitives.workspace = true
tempfile = { workspace = true, optional = true }
alloy-eips.workspace = true
alloy-consensus.workspace = true
bytes.workspace = true

# Utilities
clap.workspace = true
eyre.workspace = true
futures.workspace = true
hex.workspace = true
serde_json.workspace = true
tokio.workspace = true
rand-commonware.workspace = true
rand-core-commonware.workspace = true
tracing.workspace = true
metrics.workspace = true
thiserror.workspace = true

[dev-dependencies]
outbe-radicle.workspace = true
outbe-primitives = { workspace = true, features = ["test-utils"] }
reth-chain-state = { workspace = true, features = ["test-utils"] }
reth-db.workspace = true
reth-primitives-traits.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
alloy-rpc-types-engine.workspace = true
outbe-consensus = { workspace = true, features = ["test-utils"] }
commonware-resolver = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.9.0" }
tempfile.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
metrics-util = "0.20"
proptest.workspace = true

[package.metadata.cargo-machete]
ignored = ["metrics"]

[lints]
workspace = true
