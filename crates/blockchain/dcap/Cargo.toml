[package]
name = "outbe-dcap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "outbe-dcap-fixture"
path = "src/bin/outbe-dcap-fixture.rs"
required-features = ["dcap-fixture-tool"]

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
outbe-primitives = { path = "../primitives", default-features = false, features = ["tee-attestation-v1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true
k256 = { workspace = true, optional = true }
der = { version = "0.7.10", optional = true }
pem = { version = "3.0.6", optional = true }
time = { workspace = true, features = ["parsing"], optional = true }

[features]
# Scoped real-engine callbacks for downstream test fixtures; absent from release.
test-utils = []
# Non-production escape hatch: permits SGX quotes with `SGX_FLAGS_DEBUG` set for
# dev/testnet/e2e runs. Production builds (`production-dcap-release`) omit this.
sgx-noattest = []
e2e-test = ["sgx-noattest"]
# Pure-Rust collateral grammar and validity windows; never links Intel QVL.
collateral = ["dep:der", "dep:pem", "dep:time"]
# Consensus V1 path: links the exact-pinned Intel native QVL into the enclave.
native-dcap = [
    "collateral",
]
# Test-only syscall-boundary markers around native QVL calls. The production
# enclave crate does not forward this feature.
native-dcap-test-trace = ["native-dcap"]
# Host-only real-fixture preparation/assembly binary. This is not linked into
# the consensus library or the production enclave binary.
dcap-fixture-tool = ["native-dcap", "sgx-noattest", "dep:k256"]

[dev-dependencies]
outbe-primitives = { workspace = true, features = ["test-utils"] }
k256.workspace = true
tempfile.workspace = true

[build-dependencies]
cc = "1.2"
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
