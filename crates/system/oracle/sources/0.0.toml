# Feeder sources for the baseline protocol version. Every validator's feeder
# reads this file from the node. Do not edit it after a release: a change is a
# new file under the version that introduces it (see `src/sources.rs`).
#
# RPC URLs and API keys are not here. Each operator sets them in the local
# feeder config: `rpc_endpoints` by `chain_id`, and `api_providers`.

[[currency_pairs]]
base = "COEN"
quote = "840"
markets = [
  { provider = "uniswap" },
]

# COEN/978 = COEN/840 ÷ 978/840. The markets give dollars per euro.
[[currency_pairs]]
base = "COEN"
quote = "978"
cross = "840"
markets = [
  { provider = "chainlink_eur_usd" },
  { provider = "pyth" },
]

