name: Run GoReleaser
description: Build a standard release with the pinned release toolchain

inputs:
  dry_run:
    description: Build and package without signing or publishing
    required: true

runs:
  using: composite
  steps:
    - name: Trust the checked-out repository
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install pinned Noir build tools
      shell: bash
      run: release/scripts/install-zk-build-tools.sh
    - name: Install pinned Cosign
      if: inputs.dry_run != 'true'
      shell: bash
      env:
        COSIGN_VERSION: v2.6.5
        COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
      run: |
        install_dir="${HOME}/.cosign"
        mkdir -p "${install_dir}"
        curl --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
          -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
          -o "${install_dir}/cosign"
        echo "${COSIGN_SHA256}  ${install_dir}/cosign" | sha256sum -c -
        chmod +x "${install_dir}/cosign"
        echo "${install_dir}" >> "${GITHUB_PATH}"
    - uses: anchore/sbom-action/download-syft@v0.24.0
    - uses: Swatinem/rust-cache@v2
    - uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: ${{ inputs.dry_run == 'true' && 'release --snapshot --skip=sign --clean --parallelism=1' || 'release --clean --parallelism=1' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
