name: Setup Node.js and Yarn
description: Setup Node/Corepack/Yarn and install dependencies after repository checkout

# Foundry is not installed here: forge and cast come from the CI toolchain image
# the calling jobs run in. Node stays action-installed because the sub-projects
# pin different versions through their own .nvmrc.

inputs:
  working-directory:
    description: Directory containing package.json and dependencies
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js and Yarn
      uses: ./.github/actions/setup-node-yarn
      with:
        working-directory: ${{ inputs.working-directory }}
