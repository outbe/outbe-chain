name: Setup soldeer dependencies
description: Restore soldeer dependencies after repository checkout

# Foundry is not installed here: forge and cast come from the CI toolchain image
# the calling jobs run in. Installing a second copy per job would both waste a
# download and let the CI toolchain drift from the pinned one.

inputs:
  working-directory:
    description: Directory containing foundry.toml and soldeer.lock
    required: true

runs:
  using: composite
  steps:
    - name: Restore soldeer dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: forge soldeer install
