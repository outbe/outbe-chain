name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write
  pull-requests: write
  # The `bump` job's commit + tag push to protected main is done with a PAT
  # (secrets.RELEASE_TOKEN, in the branch ruleset's bypass list), NOT the
  # GITHUB_TOKEN - so GITHUB_TOKEN stays least-privilege here.

env:
  CARGO_TERM_COLOR: always
  # radicle-node (outbe-heartwood) bakes this in at compile time via `env!`;
  # without it every workspace-wide build fails. Release builds pass their own
  # value through the reproducible-build container args.
  SOURCE_DATE_EPOCH: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The `ci` stage of Dockerfile.project-toolchain, published by
# toolchain-image.yml. It carries the pinned Rust 1.96.0 toolchain with
# rustfmt/clippy/rust-src, Gramine, the Intel DCAP stack and the mise tool set,
# so a containerised job is `checkout` plus the command.
#
# Pinned by digest, never by tag: a tag moves, and a CI run that cannot say
# which environment produced it is not reproducible. Republishing the image
# means updating this digest in the SAME pull request - see toolchain-image.yml.
#
# `container.image` does not accept the `env` context, so the digest is repeated
# per job rather than defined once here.

jobs:
  fmt:
    name: fmt
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    steps:
      - uses: actions/checkout@v6
      # No `rustup component add rustfmt` and no mise install: the image already
      # carries the pinned toolchain with rustfmt, and the mise tool set.
      - name: Verify vendored CKB SMT provenance and panic safety
        run: bash scripts/check-vendored-smt.sh
      - run: mise run fmt-check

  clippy:
    name: clippy
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: "sccache"
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain is reachable
      # regardless of HOME, but Swatinem/rust-cache saves and restores the Cargo
      # directories under HOME. Point CARGO_HOME back inside the container's HOME
      # so the registry cache is actually what the build reads.
      CARGO_HOME: /github/home/.cargo
    steps:
      - uses: actions/checkout@v6
      # Caches ~/.cargo/registry (crate downloads) and target/ (dep artifacts),
      # keyed on Cargo.lock + rustc version. sccache still helps on lockfile
      # changes (per-crate granularity).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # NOTE: the image always carries /usr/include/sgx_dcap_quoteverify.h, so
      # `mise run lint` now also runs its native-dcap clippy pass. On the host
      # that header only existed if the DCAP job had happened to run on the same
      # machine first, so that pass fired at random.
      - run: mise run lint

  test:
    name: test
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: "sccache"
      CARGO_HOME: /github/home/.cargo
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo llvm-cov --workspace --cobertura --output-path cobertura.xml
      - uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          format: markdown
          output: both
          badge: true
      - name: Coverage to step summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md

  dcap-replay:
    name: DCAP replay (x86_64)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 30
    env:
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain works
      # regardless of HOME; Swatinem/rust-cache saves and restores under HOME.
      # Point it back inside HOME so the cache is what the build reads.
      CARGO_HOME: /github/home/.cargo
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Populate only the Cargo source cache. The verifier itself then runs
      # offline with caller-supplied collateral and no QPL/PCCS package.
      - run: cargo fetch --locked
      - name: Replay immutable DCAP evidence offline
        run: bash scripts/release/test_dcap_replay_ci.sh

  doctests:
    name: doctests
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 30
    env:
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain works
      # regardless of HOME; Swatinem/rust-cache saves and restores under HOME.
      # Point it back inside HOME so the cache is what the build reads.
      CARGO_HOME: /github/home/.cargo
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The `test` job runs under llvm-cov, which does NOT execute doctests
      # (M-24). Run them explicitly so executable doc-examples are covered.
      - run: mise run test-doc

  udeps:
    name: udeps
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 30
    env:
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain works
      # regardless of HOME; Swatinem/rust-cache saves and restores under HOME.
      # Point it back inside HOME so the cache is what the build reads.
      CARGO_HOME: /github/home/.cargo
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-udeps
      - run: cargo +nightly udeps --workspace --lib --examples --tests --benches

  no-test-deps:
    name: no-test-deps
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 10
    env:
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain works
      # regardless of HOME; Swatinem/rust-cache saves and restores under HOME.
      # Point it back inside HOME so the cache is what the build reads.
      CARGO_HOME: /github/home/.cargo
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
      - name: Ensure no arbitrary dep in production build
        run: cargo tree --package outbe-chain -e=features,no-dev | grep -Eq "arbitrary" && exit 1 || exit 0
      - name: Ensure consensus does not depend on EVM
        run: bash scripts/check-consensus-deps.sh

  # Non-blocking audit jobs (continue-on-error). Promote to required after the
  # first clean run on main.
  deny:
    name: cargo deny
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 15
    continue-on-error: true
    env:
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain works
      # regardless of HOME; Swatinem/rust-cache saves and restores under HOME.
      # Point it back inside HOME so the cache is what the build reads.
      CARGO_HOME: /github/home/.cargo
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
      - run: mise run audit-deny

  machete:
    name: cargo machete
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-machete
      - run: mise run audit-machete

  miri:
    name: cargo miri
    if: contains(github.event.head_commit.message, '[miri]')
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 60
    continue-on-error: true
    env:
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain works
      # regardless of HOME; Swatinem/rust-cache saves and restores under HOME.
      # Point it back inside HOME so the cache is what the build reads.
      CARGO_HOME: /github/home/.cargo
    steps:
      - uses: actions/checkout@v6
      # miri requires the nightly toolchain, which the pinned mise stable
      # toolchain does not provide.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo +nightly miri test --lib

  ci-success:
    name: ci success
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - doctests
      - udeps
      - no-test-deps
      - deny
      - machete
      - miri
    timeout-minutes: 5
    steps:
      - name: Decide whether all jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: clippy, test, doctests, udeps, no-test-deps, deny, machete, miri
          jobs: ${{ toJSON(needs) }}

  # --- Versioning (cocogitto) ----------------------------------------- #
  # PR-only: preview the version cog WOULD cut, without tagging anything.
  # cog is pinned in mise.toml (`cocogitto = "7"`); installed on demand here
  # rather than the full mise toolchain. Legacy pre-adoption commits are not
  # Conventional, so checks run `--from-latest-tag` (validate only commits
  # since the last `v*` release - requires a baseline `v0.1.0` tag to exist).
  preview-version:
    name: preview next version
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # cog reads the full history + tags
          persist-credentials: false
      - run: mise install cocogitto
      - name: Validate PR commits (Conventional Commits)
        run: >-
          mise exec -- cog check --ignore-merge-commits
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Preview bump
        run: |
          set -euo pipefail
          # Neutralise cog.toml's branch_whitelist for this read-only preview so
          # it works from a PR ref (nothing is committed/tagged/pushed).
          cfg="$(mktemp -d)/cog.toml"
          sed 's/^branch_whitelist.*/branch_whitelist = []/' cog.toml > "$cfg"
          if out="$(mise exec -- cog --config "$cfg" bump --auto --dry-run --skip-untracked 2>/dev/null)"; then
            tag="$(printf '%s\n' "$out" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' | tail -n1 || true)"
            echo "::notice::next release would be: ${tag:-<no bump warranted>}"
          else
            echo "::notice::no bump warranted"
          fi

  # main only, after every gate is green: cog bump --auto cuts the next v* tag
  # and (via cog.toml post-bump hooks) pushes the bump commit + tag. The push
  # is authenticated with a PAT (secrets.RELEASE_TOKEN) whose owner is in the
  # branch ruleset's bypass list, so it lands on protected main. A PAT-authored
  # tag push DOES trigger `release.yml` (`on: push: tags`), so no explicit
  # dispatch is needed (and adding one would double-fire the release).
  bump:
    name: bump version & tag
    needs: [ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(version):')
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }} # PAT in the ruleset bypass -> push to protected main + trigger release.yml
      - run: mise install cocogitto
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Validate new commits
        run: mise exec -- cog check --ignore-merge-commits "HEAD^..HEAD"
      - name: Cocogitto bump
        id: bump
        run: |
          set -euo pipefail
          # Neutralise branch_whitelist: cog doesn't see the CI checkout as the
          # `main` branch, so the in-cog guard would reject the bump. The job
          # `if:` already restricts this to a push on main. Hooks (version sed +
          # git push of the commit and tag) are preserved from cog.toml and run
          # with the PAT checkout creds.
          cfg="$(mktemp -d)/cog.toml"
          sed 's/^branch_whitelist.*/branch_whitelist = []/' cog.toml > "$cfg"
          mise exec -- cog --config "$cfg" bump --auto
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          if [ -n "$tag" ]; then echo "::notice::cut ${tag} (release.yml triggered by the tag push)"; else echo "::notice::no bump warranted"; fi
