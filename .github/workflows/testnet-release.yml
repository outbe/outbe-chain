name: 20. ELF — testnet

on:
  # release.yml dispatches this job from main for a signed testnet tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable testnet tag (vX.Y.Z-testnet.N)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testnet-elf-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  release-identity:
    name: bind the signed tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verified_commit: ${{ steps.identity.outputs.verified_commit }}
      verified_tag_object: ${{ steps.identity.outputs.verified_tag_object }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Bind workflow, tag and source identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "dispatch this protected workflow only from main" >&2
            exit 2
          }
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-testnet\.[0-9]+$ ]] || {
            echo "invalid testnet release tag: ${RELEASE_TAG}" >&2
            exit 2
          }
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          tag_object="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "${tag_object}"
          tag_identity="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
            --jq 'select(.verification.verified == true) |
              select(.object.type == "commit") |
              [.tag, .object.sha] | @tsv')"
          IFS=$'\t' read -r signed_tag_name tag_commit <<< "${tag_identity}"
          test "${signed_tag_name}" = "${RELEASE_TAG}"
          test "${tag_commit}" = "${GITHUB_SHA}"
          echo "verified_commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "verified_tag_object=${tag_object}" >> "${GITHUB_OUTPUT}"

  build:
    name: clean release build (${{ matrix.region }})
    needs: release-identity
    runs-on: [self-hosted, testnet-release-sgx, "${{ matrix.runner_label }}"]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: fr
            runner_label: release-fr
          - region: mum
            runner_label: release-mum
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-identity.outputs.verified_commit }}

      - name: Install pinned Noir build tools
        run: release/scripts/install-zk-build-tools.sh

      - name: Build the exact ELF matrix without cache
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/elf" \
            "${RUNNER_TEMP}/builder-output"
          release/scripts/reproducible-build.sh \
            --no-cache --release-tag "${RELEASE_TAG}" \
            --output "${RUNNER_TEMP}/elf"

      - name: Package the regional build without losing Unix modes
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/builder-output"
          epoch="$(jq -r .build.source_date_epoch "${RUNNER_TEMP}/elf/release-manifest.json")"
          tar --sort=name --format=gnu --mtime="@${epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -cf "${RUNNER_TEMP}/builder-output/elf.tar" \
            -C "${RUNNER_TEMP}/elf" .
          cd "${RUNNER_TEMP}/builder-output"
          sha256sum elf.tar > SHA256SUMS

      - name: Upload the regional release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-builder-${{ matrix.region }}
          path: ${{ runner.temp }}/builder-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-and-compare:
    name: compare FR and MUM release candidates
    needs: [release-identity, build]
    runs-on: testnet-release-sgx
    timeout-minutes: 45
    outputs:
      verified_commit: ${{ needs.release-identity.outputs.verified_commit }}
      verified_tag_object: ${{ needs.release-identity.outputs.verified_tag_object }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-identity.outputs.verified_commit }}

      - name: Install pinned Noir build tools
        run: release/scripts/install-zk-build-tools.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducible-builder-fr
          path: ${{ runner.temp }}/builder-fr

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducible-builder-mum
          path: ${{ runner.temp }}/builder-mum

      - name: Verify and unpack both regional candidates
        run: |
          set -euo pipefail
          for region in fr mum; do
            (
              cd "${RUNNER_TEMP}/builder-${region}"
              sha256sum --check SHA256SUMS
            )
            mkdir -p "${RUNNER_TEMP}/elf-${region}"
            tar -xf "${RUNNER_TEMP}/builder-${region}/elf.tar" \
              -C "${RUNNER_TEMP}/elf-${region}"
          done

      - name: Independently verify byte-for-byte ELF reproducibility
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-inputs"
          cargo xtask release elf compare \
            --first "${RUNNER_TEMP}/elf-fr" \
            --second "${RUNNER_TEMP}/elf-mum" \
            --repo-root . \
            --output "${RUNNER_TEMP}/release-inputs/elf-reproducibility.json"

      - name: Package the reproducible binaries
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/builder-fr/elf.tar" \
            "${RUNNER_TEMP}/release-inputs/outbe-linux-x86_64.tar"
          tar -tf "${RUNNER_TEMP}/release-inputs/outbe-linux-x86_64.tar" \
            | grep -qx './bin/outbe-chain'

      - name: Upload verified ELF candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-release-inputs
          path: ${{ runner.temp }}/release-inputs
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: publish verified ELF archive and evidence
    needs: build-and-compare
    environment: testnet-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.build-and-compare.outputs.verified_commit }}

      - name: Recheck immutable tag binding before final publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_tag_object="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          test "${remote_tag_object}" = \
            "${{ needs.build-and-compare.outputs.verified_tag_object }}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducible-release-inputs
          path: ${{ runner.temp }}/release-inputs

      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: "v2.6.5"

      - name: Sign and publish the final evidence package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          verified_tag_object='${{ needs.build-and-compare.outputs.verified_tag_object }}'
          cd "${RUNNER_TEMP}/release-inputs"
          remote_tag_object() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq 'select(.object.type == "tag") | .object.sha'
          }
          test "$(remote_tag_object)" = "${verified_tag_object}"
          sha256sum outbe-linux-x86_64.tar elf-reproducibility.json > SHA256SUMS
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp \
              '^https://github.com/outbe/outbe-chain/.github/workflows/testnet-release.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha \
              '${{ needs.build-and-compare.outputs.verified_commit }}' \
            SHA256SUMS
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; use a new immutable tag" >&2
            exit 2
          fi
          assets=(outbe-linux-x86_64.tar elf-reproducibility.json SHA256SUMS SHA256SUMS.sigstore.json)
          test "$(remote_tag_object)" = "${verified_tag_object}"
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --verify-tag --draft --prerelease --title "Outbe ${RELEASE_TAG}"
          roundtrip="${RUNNER_TEMP}/release-roundtrip"
          mkdir "${roundtrip}"
          gh release download "${RELEASE_TAG}" --dir "${roundtrip}"
          for asset in "${assets[@]}"; do
            cmp --silent "${asset}" "${roundtrip}/$(basename "${asset}")"
          done
          test "$(remote_tag_object)" = "${verified_tag_object}"
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
