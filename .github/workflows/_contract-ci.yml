name: Contract CI

on:
  workflow_call:
    inputs:
      project:
        description: "Sub-project directory under contracts/ (e.g. intent, tokens, vault)"
        type: string
        required: true
      abi-check:
        description: "Verify committed abi-export/ is up to date (only where ABIs are exported)"
        type: boolean
        default: false
      upgrade-check:
        description: "Check that the upgradeable contracts are upgrade-safe"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contract-ci-${{ inputs.project }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  format:
    name: Forge Format
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/${{ inputs.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check formatting
        run: forge fmt --check

  compile:
    name: Compile Contracts
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/${{ inputs.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-foundry-soldeer
        with:
          working-directory: contracts/${{ inputs.project }}

      - name: Compile contracts
        run: forge build

  test:
    name: Foundry Tests
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/${{ inputs.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-foundry-soldeer
        with:
          working-directory: contracts/${{ inputs.project }}

      - name: Run tests
        run: forge test -vvv

  lint:
    name: Forge Lint
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/${{ inputs.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-foundry-soldeer
        with:
          working-directory: contracts/${{ inputs.project }}

      - name: Run lint
        run: forge lint --severity high

  abi:
    name: ABI Export Check
    if: ${{ inputs.abi-check }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/${{ inputs.project }}
    env:
      # forge comes from setup-foundry-soldeer; don't let mise pull in the repo's
      # Rust toolchain just to run the export-abi task.
      MISE_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-foundry-soldeer
        with:
          working-directory: contracts/${{ inputs.project }}

      - name: Export ABI
        run: mise run export-abi

      - name: Verify abi-export is up to date
        run: |
          if ! git diff --quiet -- abi-export; then
            echo "::error::abi-export is stale - run 'mise run export-abi' and commit the result"
            git diff -- abi-export
            exit 1
          fi

  upgrade:
    name: Upgrade Safety Check
    if: ${{ inputs.upgrade-check }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/${{ inputs.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-foundry-soldeer
        with:
          working-directory: contracts/${{ inputs.project }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: forge clean && forge build

      - name: Validate upgrade safety
        run: >-
          npx --yes @openzeppelin/upgrades-core@1.46.0 validate out/build-info --exclude 'test/**'
          --unsafeAllow 'constructor,state-variable-immutable,missing-initializer-call,external-library-linking'

  ci-success:
    name: ci success
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - format
      - compile
      - test
      - lint
      - abi
      - upgrade
    timeout-minutes: 5
    steps:
      - name: Decide whether all jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: test,abi,upgrade
          jobs: ${{ toJSON(needs) }}
