name: goreleaser

on:
  push:
    tags:
      - "v[0-9]+.*"
  # Dispatched by the CI `bump` job for a freshly-cut tag: a GITHUB_TOKEN-pushed
  # tag cannot re-trigger this workflow via the `push` event, so it is invoked
  # explicitly (`gh workflow run release.yml --ref <tag>`). `github.ref_name`
  # then resolves to the tag, so the goreleaser job below is unchanged.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write
  security-events: write

jobs:
  # Immutable production-network tags are released by their protected SGX
  # workflows, which own the reproducible ELF build,
  # the signed SGX bundle and the GitHub release itself. goreleaser must not
  # create that release first, or the SGX pipeline's finalize step aborts on an
  # already-existing tag.
  goreleaser:
    if: "!contains(github.ref_name, '-rc') && !contains(github.ref_name, '-testnet.') && !contains(github.ref_name, '-mainnet.')"
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:0e0603bd4fa1a68676c4d43d294440d0a07739c731aa09dac042165c8b7811f9
    env:
      # The image sets CARGO_HOME=/usr/local/cargo so the toolchain works
      # regardless of HOME; Swatinem/rust-cache saves and restores under HOME.
      # Point it back inside HOME so the cache is what the build reads.
      CARGO_HOME: /github/home/.cargo
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: sigstore/cosign-installer@v4.1.1
      - uses: anchore/sbom-action/download-syft@v0.24.0
      - uses: Swatinem/rust-cache@v2
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}

  # Pushing vX.Y.Z-testnet.N starts the protected SGX release. It is dispatched
  # rather than triggered directly because testnet-release.yml must run with
  # `refs/heads/main` as its workflow ref: the Sigstore certificate identity it
  # signs and re-verifies is pinned to that ref in xtask/src/release/sgx.rs and
  # release/release-manifest-v1.schema.json. The dispatched run checks out the
  # tag itself and re-verifies the signed tag object before it signs anything.
  dispatch-testnet-release:
    name: dispatch protected SGX release
    if: contains(github.ref_name, '-testnet.')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      OUTBE_TESTNET_SEEDED_GENESIS_SHA256: ${{ vars.OUTBE_TESTNET_SEEDED_GENESIS_SHA256 }}
      OUTBE_TESTNET_SEEDED_GENESIS_URL: ${{ vars.OUTBE_TESTNET_SEEDED_GENESIS_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch testnet-release.yml for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-testnet\.[0-9]+$ ]] || {
            echo "not an immutable testnet tag: ${RELEASE_TAG}" >&2
            exit 2
          }
          test -n "${OUTBE_TESTNET_SEEDED_GENESIS_URL}"
          [[ "${OUTBE_TESTNET_SEEDED_GENESIS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          gh workflow run testnet-release.yml \
            --ref main \
            --field release_tag="${RELEASE_TAG}" \
            --field seeded_genesis_url="${OUTBE_TESTNET_SEEDED_GENESIS_URL}" \
            --field seeded_genesis_sha256="${OUTBE_TESTNET_SEEDED_GENESIS_SHA256}"

  # Mainnet uses the same immutable tag binding, but its exact genesis is an
  # explicit protected-environment input rather than a tracked placeholder.
  dispatch-mainnet-release:
    name: dispatch protected Mainnet SGX release
    if: contains(github.ref_name, '-mainnet.')
    runs-on: ubuntu-24.04
    environment: mainnet-release
    permissions:
      contents: read
      actions: write
    env:
      OUTBE_MAINNET_SEEDED_GENESIS_SHA256: ${{ vars.OUTBE_MAINNET_SEEDED_GENESIS_SHA256 }}
      OUTBE_MAINNET_SEEDED_GENESIS_URL: ${{ vars.OUTBE_MAINNET_SEEDED_GENESIS_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch mainnet-release.yml for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTBE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${OUTBE_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mainnet\.[0-9]+$ ]] || {
            echo "not an immutable Mainnet tag: ${OUTBE_RELEASE_TAG}" >&2
            exit 2
          }
          test -n "${OUTBE_MAINNET_SEEDED_GENESIS_URL}"
          [[ "${OUTBE_MAINNET_SEEDED_GENESIS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          gh workflow run mainnet-release.yml \
            --ref main \
            --field release_tag="${OUTBE_RELEASE_TAG}" \
            --field seeded_genesis_url="${OUTBE_MAINNET_SEEDED_GENESIS_URL}" \
            --field seeded_genesis_sha256="${OUTBE_MAINNET_SEEDED_GENESIS_SHA256}"
