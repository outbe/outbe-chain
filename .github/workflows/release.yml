name: 18. Software bundle

on:
  push:
    tags:
      - "v[0-9]+.*"
  # Manual fallback for an existing tag. Select the tag as the workflow ref;
  # `github.ref_name` then resolves to that tag just like a tag-push run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write
  security-events: write

jobs:
  # Immutable production-network tags remain owned by their protected ELF
  # workflows. Standard tags publish the network-neutral software bundle.
  software-bundle:
    if: "!contains(github.ref_name, '-rc') && !contains(github.ref_name, '-testnet.') && !contains(github.ref_name, '-mainnet.')"
    runs-on: testnet-release-sgx
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-software-bundle
        with:
          profile: production
          output: ${{ runner.temp }}/outbe-software
          release_tag: ${{ github.ref_name }}
          no_cache: "true"
      - name: Create checksums
        working-directory: ${{ runner.temp }}/outbe-software
        run: sha256sum ./*.tar.zst > SHA256SUMS
      - name: Install pinned Cosign
        env:
          COSIGN_VERSION: v2.6.5
          COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/cosign"
          mkdir -p "${install_dir}"
          curl --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "${install_dir}/cosign"
          echo "${COSIGN_SHA256}  ${install_dir}/cosign" | sha256sum -c -
          chmod +x "${install_dir}/cosign"
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Sign checksums
        working-directory: ${{ runner.temp }}/outbe-software
        run: cosign sign-blob --bundle=SHA256SUMS.sigstore.json SHA256SUMS --yes
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OUTBE_RELEASE_TAG: ${{ github.ref_name }}
          OUTBE_SOFTWARE_DIR: ${{ runner.temp }}/outbe-software
        run: |
          set -euo pipefail
          gh release create "${OUTBE_RELEASE_TAG}" \
            --verify-tag \
            --generate-notes \
            --title "${OUTBE_RELEASE_TAG}" \
            "${OUTBE_SOFTWARE_DIR}"/*.tar.zst \
            "${OUTBE_SOFTWARE_DIR}/SHA256SUMS" \
            "${OUTBE_SOFTWARE_DIR}/SHA256SUMS.sigstore.json"

  # Protected network workflows run from main and independently validate the signed tag.
  dispatch-testnet-release:
    name: dispatch protected Testnet ELF release
    if: contains(github.ref_name, '-testnet.')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch testnet-release.yml for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-testnet\.[0-9]+$ ]] || {
            echo "not an immutable testnet tag: ${RELEASE_TAG}" >&2
            exit 2
          }
          gh workflow run testnet-release.yml \
            --ref main \
            --field release_tag="${RELEASE_TAG}"

  # Mainnet uses the same immutable tag binding and a protected environment.
  dispatch-mainnet-release:
    name: dispatch protected Mainnet ELF release
    if: contains(github.ref_name, '-mainnet.')
    runs-on: ubuntu-24.04
    environment: mainnet-release
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch mainnet-release.yml for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTBE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${OUTBE_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mainnet\.[0-9]+$ ]] || {
            echo "not an immutable Mainnet tag: ${OUTBE_RELEASE_TAG}" >&2
            exit 2
          }
          gh workflow run mainnet-release.yml \
            --ref main \
            --field release_tag="${OUTBE_RELEASE_TAG}"
