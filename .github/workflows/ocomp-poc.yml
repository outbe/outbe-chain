name: OCOMP PoC

on:
  pull_request:
    paths:
      - "outbe-plan/**"
      - "bin/outbe-ocomp/**"
      - "crates/blockchain/evm/**"
      - "crates/blockchain/node/**"
      - "crates/core/lysis/**"
      - "crates/core/desis/**"
      - "crates/core/metadosis/**"
      - "crates/core/promislimit/**"
      - "crates/system/ocomp-protocol/**"
      - "testing/e2e-harness/**"
      - "testing/lysis-v1-reference/**"
      - "deploy/systemd/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - ".github/workflows/ocomp-poc.yml"
  push:
    branches: ["main", "feat/ocomp-poc"]
    paths:
      - "outbe-plan/**"
      - "bin/outbe-ocomp/**"
      - "crates/blockchain/evm/**"
      - "crates/blockchain/node/**"
      - "crates/core/lysis/**"
      - "crates/core/desis/**"
      - "crates/core/metadosis/**"
      - "crates/core/promislimit/**"
      - "crates/system/ocomp-protocol/**"
      - "testing/e2e-harness/**"
      - "testing/lysis-v1-reference/**"
      - "deploy/systemd/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - ".github/workflows/ocomp-poc.yml"
  workflow_dispatch:
    inputs:
      run_closure:
        description: "Run the fail-closed full closure gate"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ocm-task-progress:
    name: OCM task progress
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustup component add clippy
      - run: mise run ocomp-poc-task -- OCM-05

  poc-closure:
    name: PoC closure (fail closed)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_closure)
    runs-on: [self-hosted, linux, ocomp-systemd-cgroup-v2]
    timeout-minutes: 360
    env:
      OUTBE_PROJECTION_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustup component add clippy
      - name: Start transaction-capable MongoDB
        run: |
          docker run --detach --name outbe-ocomp-mongodb --publish 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          until docker exec outbe-ocomp-mongodb mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; do sleep 1; done
          docker exec outbe-ocomp-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          until docker exec outbe-ocomp-mongodb mongosh --quiet --eval 'rs.status().myState' | grep -q 1; do sleep 1; done
      - name: Install isolated OCOMP service identities
        run: sudo systemd-sysusers deploy/systemd/outbe-ocomp.sysusers
      - name: Execute exact-artifact closure once
        run: mise run ocomp-poc-closure-run -- --output-dir "$RUNNER_TEMP/ocomp-evidence"
      - name: Retain first-attempt lanes, manifests and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocomp-poc-closure-${{ github.sha }}
          path: ${{ runner.temp }}/ocomp-evidence
          if-no-files-found: warn
          retention-days: 14
