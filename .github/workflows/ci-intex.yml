name: 06. intex

on:
  push:
    branches: ["main"]
    paths:
      - ".github/actions/**"
      - ".github/workflows/_contract-ci.yml"
      - ".github/workflows/ci-intex.yml"
      - "contracts/intex/**"
      - "contracts/precompiles/**"
      - "contracts/shared/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/actions/**"
      - ".github/workflows/_contract-ci.yml"
      - ".github/workflows/ci-intex.yml"
      - "contracts/intex/**"
      - "contracts/precompiles/**"
      - "contracts/shared/**"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_contract-ci.yml
    with:
      project: intex
      abi-check: true
      upgrade-check: true
      slither-check: true
      aderyn-check: true
      isolated-tests: test/foundry/cross-chain/GasBudget.t.sol
