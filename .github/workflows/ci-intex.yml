name: CI intex

on:
  push:
    branches: ["main"]
    paths:
      - ".github/actions/**"
      - "contracts/intex/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/actions/**"
      - "contracts/intex/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  lint:
    name: Solhint
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/intex
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-node-yarn
        with:
          working-directory: contracts/intex

      - name: Run Solhint
        run: yarn lint

  format:
    name: Forge Format
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/intex
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting
        run: forge fmt --check

  compile:
    name: Compile Contracts
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    defaults:
      run:
        working-directory: contracts/intex
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-node-yarn-foundry
        with:
          working-directory: contracts/intex

      - name: Compile contracts
        run: yarn compile

  test-foundry:
    name: Foundry Tests
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    needs: [compile]
    defaults:
      run:
        working-directory: contracts/intex
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-node-yarn-foundry
        with:
          working-directory: contracts/intex

      - name: Run Forge tests
        run: forge test -vv --no-match-path 'test/foundry/cross-chain/GasBudget.t.sol'

      # Runs apart because it needs `--isolate`: a delivery is its own transaction against cold storage,
      # and the shared-context run understates that by a third or more. The budgets are sized from it.
      - name: Check destination-gas budgets against cold-storage cost
        run: forge test --isolate --match-path 'test/foundry/cross-chain/GasBudget.t.sol' -vv

  abi:
    name: ABI Export Check
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    needs: [compile]
    defaults:
      run:
        working-directory: contracts/intex
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-node-yarn-foundry
        with:
          working-directory: contracts/intex

      - name: Export ABI
        run: yarn compile && yarn cd:extract-abi

      - name: Verify abi-export is up to date
        run: |
          if ! git diff --quiet -- abi-export; then
            echo "::error::abi-export is stale - run 'yarn compile && yarn cd:extract-abi' and commit the result"
            git diff -- abi-export
            exit 1
          fi

  slither:
    name: Slither
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    needs: [compile]
    defaults:
      run:
        working-directory: contracts/intex
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-node-yarn-foundry
        with:
          working-directory: contracts/intex

      - name: Run Slither
        run: yarn slither:ci

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intex-slither-report
          path: contracts/intex/slither-report.sarif
          retention-days: 14

  aderyn:
    name: Aderyn
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    needs: [compile]
    defaults:
      run:
        working-directory: contracts/intex
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-node-yarn-foundry
        with:
          working-directory: contracts/intex

      - name: Run Aderyn
        run: yarn aderyn

      - name: Upload Aderyn report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intex-aderyn-report
          path: contracts/intex/report.md
          retention-days: 14

  ci-success:
    name: ci success
    runs-on: testnet-release-sgx
    container:
      image: ghcr.io/outbe/project-toolchain-ci@sha256:6bd81f9d0ddd3de23649fb8cadf274d74701662c2ec9e0d9cfeed1036aa4f1c1
    if: always()
    needs:
      - lint
      - format
      - compile
      - test-foundry
      - abi
      - slither
      - aderyn
    timeout-minutes: 5
    steps:
      - name: Decide whether all jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        env:
          # The job container runs as a different UID than the host runner.
          # Keep Python from leaving an undeletable __pycache__ in _actions.
          PYTHONDONTWRITEBYTECODE: "1"
        with:
          jobs: ${{ toJSON(needs) }}
