name: 17. Software bundle — preflight

run-name: Standard release preflight — ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-bundle:
    name: build and verify without publishing
    runs-on: testnet-release-sgx
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-software-bundle
        with:
          output: ${{ runner.temp }}/outbe-software
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outbe-software
          path: ${{ runner.temp }}/outbe-software
          if-no-files-found: error
          retention-days: 7
