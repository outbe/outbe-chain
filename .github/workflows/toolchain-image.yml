name: 10. toolchain-image

# Builds and publishes the `ci` stage of Dockerfile.project-toolchain - the
# environment every containerised CI job runs in.
#
# The image exists so a job body is `checkout` plus the command itself. Before
# it, jobs installed their dependencies onto the shared self-hosted runner with
# `sudo apt-get` (including `--allow-downgrades` on libstdc++6 and libgcc-s1),
# which mutated host state under every other job on the same machine.
#
# Consumers pin the image by digest, never by tag. `latest` moves; a digest is
# the only reference that makes a CI run reproducible, and it is what the
# `container:` blocks in the other workflows carry.
#
# CHANGING THE PINS: this image is FROM the `toolchain` stage, so the Rust
# and Intel DCAP versions CI compiles against are the release ones by
# construction. When any input below changes, this workflow republishes - and
# the new digest has to land in the consuming workflows in the SAME pull
# request, or they keep running the previous environment.

on:
  # Manual is the primary path: publishing is a deliberate act, and the digest it
  # prints has to be pasted into the consuming workflows by hand anyway.
  workflow_dispatch:
  # A pull request builds the image and does not publish it. The recipe, the
  # version pin, and the frozen APT inputs all change what that build contains.
  pull_request:
    paths:
      - "Dockerfile.project-toolchain"
      - "release/project-toolchain-v1.json"
      - "release/apt/**"
  # A push to main republishes only when the Dockerfile itself changes. The
  # recipe also reads release/project-toolchain-v1.json, release/apt/ubuntu.sources,
  # mise.toml and contracts/intex/mise.toml. After one of those changes on main,
  # republish manually.
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.project-toolchain"

permissions:
  contents: read

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/project-toolchain-ci
  # Container jobs can leave root-owned files in the runner's default checkout.
  # Keep this host-side publisher in a dedicated directory that checkout owns.
  TOOLCHAIN_CHECKOUT: _toolchain-image-source

jobs:
  # A pull request must not reach the self-hosted publisher. That job can
  # write packages. This one only reads the repo, checks the recipe, and
  # builds the CI stage with no registry login and no build secret.
  verify-pull-request:
    name: verify toolchain on pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify the toolchain recipe against the version pin
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          chmod 0755 /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain none --profile minimal
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo xtask release toolchain verify-repo

      - name: Build the CI stage without publishing
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --target ci \
            -f Dockerfile.project-toolchain .

  build:
    name: build and publish
    if: github.event_name != 'pull_request'
    # Keep the toolchain image build on the on-premise pool. It has no
    # dependency on the image it produces, so there is no bootstrap cycle.
    runs-on: testnet-release-sgx
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: ${{ env.TOOLCHAIN_CHECKOUT }}

      # The recipe is the machine-checked contract between this image and
      # release/project-toolchain-v1.json: pinned base image digests, the APT
      # closure, and the release artifact stages. Fail here rather than
      # publishing an image that has drifted from the pin.
      - name: Verify the toolchain recipe against the version pin
        working-directory: ${{ env.TOOLCHAIN_CHECKOUT }}
        run: cargo xtask release toolchain verify-repo

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # This job does not run for a pull request. Publishing stays on a
      # dispatch or a main push. The pull request job builds without a push.
      - name: Build (and publish on main)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.TOOLCHAIN_CHECKOUT }}
          file: ${{ env.TOOLCHAIN_CHECKOUT }}/Dockerfile.project-toolchain
          target: ci
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the only thing consumers may reference, so surface it
      # where whoever triggered the build will look for it.
      - name: Report the digest to pin
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## CI toolchain image published"
            echo
            echo '```yaml'
            echo "container:"
            echo "  image: ${IMAGE_REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "Update every \`container:\` block in .github/workflows/ to this"
            echo "digest in the same pull request as the change that produced it."
          } >> "$GITHUB_STEP_SUMMARY"
