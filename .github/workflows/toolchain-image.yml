name: CI toolchain image

# Builds and publishes the `ci` stage of Dockerfile.project-toolchain - the
# environment every containerised CI job runs in.
#
# The image exists so a job body is `checkout` plus the command itself. Before
# it, jobs installed their dependencies onto the shared self-hosted runner with
# `sudo apt-get` (including `--allow-downgrades` on libstdc++6 and libgcc-s1),
# which mutated host state under every other job on the same machine.
#
# Consumers pin the image by digest, never by tag. `latest` moves; a digest is
# the only reference that makes a CI run reproducible, and it is what the
# `container:` blocks in the other workflows carry.
#
# CHANGING THE PINS: this image is FROM the `toolchain` stage, so the Rust,
# Gramine and Intel DCAP versions CI compiles against are the release ones by
# construction. When any input below changes, this workflow republishes - and
# the new digest has to land in the consuming workflows in the SAME pull
# request, or they keep running the previous environment.

on:
  # Manual is the primary path: publishing is a deliberate act, and the digest it
  # prints has to be pasted into the consuming workflows by hand anyway.
  workflow_dispatch:
  # Plus the one file that defines the image. The recipe also reads
  # release/project-toolchain-v1.json, release/apt/ubuntu.sources, mise.toml and
  # contracts/intex/mise.toml - a change to any of those alters what the image
  # contains without touching this trigger, so republish manually after one.
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.project-toolchain"

permissions:
  contents: read

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/project-toolchain-ci

jobs:
  build:
    name: build and publish
    # The same self-hosted pool as every other job. This is a plain docker build
    # and push, so it has no dependency on the image it produces - there is no
    # bootstrap cycle.
    runs-on: testnet-release-sgx
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The recipe is the machine-checked contract between this image and
      # release/project-toolchain-v1.json: pinned base image digests, the exact
      # 14-package APT closure, and the release artifact stages. Fail here
      # rather than publishing an image that has drifted from the pin.
      - name: Verify the toolchain recipe against the version pin
        run: python3 scripts/release/verify_project_toolchain.py

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # On a pull request the image is built but not pushed: a recipe that no
      # longer builds is caught in review, without publishing from an unmerged
      # branch.
      - name: Build (and publish on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.project-toolchain
          target: ci
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the only thing consumers may reference, so surface it
      # where whoever triggered the build will look for it.
      - name: Report the digest to pin
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## CI toolchain image published"
            echo
            echo '```yaml'
            echo "container:"
            echo "  image: ${IMAGE_REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "Update every \`container:\` block in .github/workflows/ to this"
            echo "digest in the same pull request as the change that produced it."
          } >> "$GITHUB_STEP_SUMMARY"
