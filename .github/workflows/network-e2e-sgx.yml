name: Network E2E SGX

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: network-e2e-sgx
  cancel-in-progress: false

jobs:
  network:
    runs-on: testnet-release-sgx
    timeout-minutes: 240
    env:
      SOURCE_DATE_EPOCH: "0"
      RAYON_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v6
      - name: Build exact SGX network artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -j 4 -p outbe-e2e-harness --features ocomp-integration --bin outbe-e2e-build
          target/release/outbe-e2e-build --lane sgx-no-attest --jobs 4 \
            --output "${RUNNER_TEMP}/network-e2e-build.json"
      - name: Run real network scenarios and verify complete evidence
        shell: bash
        run: |
          set -euo pipefail
          scenarios=(
            'consensus_resilience|Two of four validators cannot finalize'
            'consensus_resilience|recovers from HTTP 429'
            'consensus_resilience|recovers from its original upstream'
            'consensus_resilience|rejects a forged finalized proof'
            'price_oracle|Feeder source failures leave'
            'encrypted_tribute|while one validator enclave is unavailable'
            'ocomp|correctly bound conflicting OCOMP vote'
            'ocomp|A new FullNode starts from signed native files'
            'products|governed stablecoin'
            'radicle|'
            'tee_observability|wrong durable TEE genesis and identity'
            'projection_write_fault|full projection volume'
            'credis|A called Credis left unpaid past its notice is forfeited'
            'hyperlane_controller|A silent bridge signer is jailed'
          )
          for index in "${!scenarios[@]}"; do
            IFS='|' read -r feature name <<< "${scenarios[$index]}"
            evidence="${RUNNER_TEMP}/network-e2e-evidence/${index}"
            mkdir -p "$evidence"
            selection=(--input "testing/e2e-harness/features/${feature}.feature" --concurrency 1)
            if [[ -n "$name" ]]; then
              selection+=(--name "$name")
            fi
            target/release/outbe-e2e --tee sgx-no-attest --sudo --all \
              --artifact-manifest "${RUNNER_TEMP}/network-e2e-build.json" \
              --evidence-dir "$evidence" \
              "${selection[@]}"
            jq -e '
              .complete == true and .result == "passed" and
              .scenarios.selected == 1 and .scenarios.started == 1 and
              .scenarios.finished == 1 and .scenarios.passed == 1 and
              .scenarios.skipped == 0 and .scenarios.failed == 0 and
              .scenarios.evidence_records == 1 and
              .errors.parsing == 0 and .errors.hooks == 0 and
              (.artifacts.members | length) > 0
            ' "$evidence/run-manifest.json"
          done
      - name: Upload network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-e2e-sgx-evidence
          path: |
            ${{ runner.temp }}/network-e2e-build.json
            ${{ runner.temp }}/network-e2e-evidence
          if-no-files-found: warn
          retention-days: 30
